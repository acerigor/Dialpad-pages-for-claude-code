<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.notif-panel{display:none;position:fixed;top:64px;right:24px;width:420px;max-height:560px;background:var(--sur);border:0.5px solid var(--brd);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);z-index:70;flex-direction:column;overflow:hidden;}
.notif-panel.open{display:flex;}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
.notif-title{font-size:14px;font-weight:600;color:var(--tx);}
.notif-header-actions{display:flex;align-items:center;gap:6px;}
.notif-markall{background:transparent;border:none;color:var(--ac2);font-family:var(--font);font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer;}
.notif-markall:hover{background:rgba(79,124,255,.10);}
.notif-markall[disabled]{opacity:.4;cursor:not-allowed;}
.notif-markall[disabled]:hover{background:transparent;}
.notif-close{display:none;width:36px;height:36px;border-radius:8px;background:transparent;border:none;color:var(--mu);cursor:pointer;align-items:center;justify-content:center;}
.notif-close:hover{background:rgba(255,255,255,.05);color:var(--tx);}
.notif-tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
.notif-tab{background:transparent;border:none;color:var(--mu);font-family:var(--font);font-size:12.5px;padding:8px 10px;border-bottom:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.notif-tab:hover{color:var(--tx);}
.notif-tab.active{color:var(--ac2);border-bottom-color:var(--ac);}
.notif-tab-count{font-family:var(--mono);font-size:10.5px;color:var(--mu);background:var(--sur2);padding:2px 6px;border-radius:8px;}
.notif-tab.active .notif-tab-count{color:var(--ac2);background:rgba(79,124,255,.16);}
.notif-body{overflow-y:auto;flex:1;min-height:120px;}
.notif-empty{padding:40px 20px;text-align:center;color:var(--mu);font-size:12.5px;}
.notif-group{padding:0 0 6px;}
.notif-group-head{font-size:10.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;padding:12px 18px 6px;}
.notif-item{display:flex;gap:12px;padding:10px 18px;cursor:pointer;position:relative;border-bottom:0.5px solid rgba(255,255,255,.03);}
.notif-item:hover{background:var(--sur2);}
.notif-item.unread{background:rgba(79,124,255,.04);}
.notif-item.unread:hover{background:rgba(79,124,255,.08);}
.notif-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sur2);color:var(--mu);}
.notif-icon svg{width:16px;height:16px;}
.notif-icon.new_lead{background:rgba(79,124,255,.14);color:var(--ac2);}
.notif-icon.engagement{background:rgba(34,200,138,.14);color:var(--gr);}
.notif-icon.reminder{background:rgba(245,166,35,.14);color:var(--am);}
.notif-icon.status_change{background:rgba(20,184,166,.14);color:#2dd4bf;}
.notif-icon.assignment{background:rgba(167,139,250,.14);color:#c4b5fd;}
.notif-text{flex:1;min-width:0;}
.notif-item-title{font-size:12.5px;font-weight:500;color:var(--tx);line-height:1.35;}
.notif-item.unread .notif-item-title{font-weight:600;}
.notif-item-body{font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.4;}
.notif-item-time{font-family:var(--mono);font-size:10.5px;color:var(--mu);margin-top:4px;}
.notif-unread-dot{position:absolute;top:18px;right:18px;width:7px;height:7px;border-radius:50%;background:var(--ac);}
.notif-footer{padding:8px;border-top:0.5px solid var(--brd);flex-shrink:0;}
.notif-seeall{width:100%;background:transparent;border:none;color:var(--ac2);font-family:var(--font);font-size:12.5px;padding:9px;border-radius:8px;cursor:pointer;}
.notif-seeall:hover{background:rgba(79,124,255,.08);}
.ur-head-spacer{flex:1;}

/* Department Permissions list rows */
.ur-list{background:var(--sur);border:0.5px solid var(--brd2);border-radius:12px;overflow:hidden;}
.ur-row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:0.5px solid var(--brd);transition:background .15s;}
.ur-row:hover{background:var(--sur2);}
.ur-row:last-child{border-bottom:none;}
.ur-row-ic{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(79,124,255,.10);color:var(--ac2);}
.ur-row-ic svg{width:20px;height:20px;}
.ur-row-txt{min-width:0;flex:1;}
.ur-row-title{font-size:13.5px;font-weight:600;color:var(--tx);}
.ur-row-sub{font-size:12px;color:var(--mu);margin-top:3px;}
.ur-row-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.dp-row-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dp-row-sub-empty{color:var(--mu);font-style:italic;}
.dp-edit-btn{width:32px;height:32px;border-radius:6px;background:none;border:none;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;}
.dp-edit-btn:hover{background:var(--sur2);color:var(--tx);}
.dp-edit-btn svg{width:16px;height:16px;}
@media (max-width:640px){
  .dp-edit-btn{width:44px;height:44px;}
  .dp-edit-btn svg{width:18px;height:18px;}
}
</style>

      <span>Settings</span>
    </a>
    <span class="set-page-title">Department Permissions</span>
    <span class="ur-head-spacer"></span>
  </div>
  <div class="set-scroll">
    <section class="set-section">
      <div class="ur-list" id="dp-list"></div>
    </section>
  </div>
</div>

<script>
function navClick(label){
  if(label === 'Settings') return;
  var routes = {
    'Home':'../../coreconnect_dashboard_v41/coreconnect_dashboard_v41.html',
    'CRM':'../../coreconnect_leads_v83/coreconnect_leads_v83.html',
    'Call':'../../call_history/coreconnect_call_history_v31.html',
    'Message':'../../coreconnect_message_history_v41/coreconnect_message_history_v41.html',
    'Voice mail':'../../coreconnect_voicemail_history_v9/coreconnect_voicemail_history_v9.html',
    'Appointments':'../../coreconnect_appointments/coreconnect_appointments.html'
  };
  if(routes[label]){ window.location.href = routes[label]; return; }
  showNavToast(label + ' is coming soon', 'This feature is under construction.');
}
function toggleMobileDrawer(){
  var d = document.getElementById('mobile-drawer'), b = document.getElementById('mobile-drawer-backdrop');
  if(!d || !b) return;
  if(d.classList.contains('open')) closeMobileDrawer();
  else { d.classList.add('open'); b.classList.add('open'); }
}
function closeMobileDrawer(){
  var d = document.getElementById('mobile-drawer'), b = document.getElementById('mobile-drawer-backdrop');
  if(d) d.classList.remove('open'); if(b) b.classList.remove('open');
}
var navToastTimer = null;
function showNavToast(title, body){
  var t = document.getElementById('nav-toast'); if(!t) return;
  if(title) document.getElementById('nav-toast-title').textContent = title;
  if(body)  document.getElementById('nav-toast-body').textContent  = body;
  t.classList.add('show');
  if(navToastTimer) clearTimeout(navToastTimer);
  navToastTimer = setTimeout(hideNavToast, 4000);
}
function hideNavToast(){
  var t = document.getElementById('nav-toast'); if(t) t.classList.remove('show');
  if(navToastTimer){ clearTimeout(navToastTimer); navToastTimer = null; }
}
document.addEventListener('DOMContentLoaded', function(){ if(typeof renderNotifications === 'function') renderNotifications(); });

/* Department Permissions — list */
var DP_KEY = 'cc_dept_perms', DP_VER = 'v1';
var DP_PERM_LABELS = [
  {id:'p_overview',      name:'Dialpad Overview Page'},
  {id:'p_sms_tmpl',      name:'User SMS Template CRUD Page'},
  {id:'p_email_tmpl',    name:'Email Template CRUD Page'},
  {id:'p_label_flag',    name:'Label Flag CRUD Page'},
  {id:'p_library',       name:'Dialpad Library CRUD Page'},
  {id:'p_bc_loc',        name:'Business Card Display Location'},
  {id:'p_call_history',  name:'Call History Tab'},
  {id:'p_msg_history',   name:'Message History Tab'},
  {id:'p_voicemail',     name:'Voicemail Tab'},
  {id:'p_crm',           name:'CRM Tab'}
];
var DP_ICON_BRIEF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>';
var DP_ICON_EDIT  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';

function dpEsc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dpDepartments(){
  if(!window.CCLeads || !Array.isArray(CCLeads.TEAM)) return [];
  var seen = {}, out = [];
  CCLeads.TEAM.forEach(function(m){
    var d = (m && m.dept || '').trim(); if(!d || seen[d]) return; seen[d] = 1; out.push(d);
  });
  return out;
}
function dpLoad(){
  try{
    var raw = localStorage.getItem(DP_KEY);
    var p = raw ? JSON.parse(raw) : null;
    if(p && p.ver === DP_VER && p.map && typeof p.map === 'object') return p.map;
  }catch(e){}
  var m = {}; dpDepartments().forEach(function(d){ m[d] = []; });
  try{ localStorage.setItem(DP_KEY, JSON.stringify({ver:DP_VER, map:m})); }catch(e){}
  return m;
}
function dpLabelsFor(ids){
  var byId = {}; DP_PERM_LABELS.forEach(function(p){ byId[p.id] = p.name; });
  return (ids || []).map(function(id){ return byId[id]; }).filter(Boolean);
}
function dpRender(){
  var host = document.getElementById('dp-list'); if(!host) return;
  var depts = dpDepartments();
  var map = dpLoad();
  if(!depts.length){
    host.innerHTML = '<div class="ur-row"><div class="ur-row-txt"><div class="ur-row-sub dp-row-sub-empty">No departments defined yet.</div></div></div>';
    return;
  }
  host.innerHTML = depts.map(function(d){
    var labels = dpLabelsFor(map[d] || []);
    var joined = labels.join(', ');
    var sub = labels.length
      ? '<div class="ur-row-sub dp-row-sub" title="'+dpEsc(joined)+'">'+dpEsc(joined)+'</div>'
      : '<div class="ur-row-sub dp-row-sub-empty">No permissions assigned</div>';
    return '<div class="ur-row">'
      + '<div class="ur-row-ic">'+DP_ICON_BRIEF+'</div>'
      + '<div class="ur-row-txt">'
        + '<div class="ur-row-title">'+dpEsc(d)+'</div>'
        + sub
      + '</div>'
      + '<div class="ur-row-actions">'
        + '<button class="dp-edit-btn" type="button" aria-label="Edit '+dpEsc(d)+'" onclick="dpEditOpen(\''+dpEsc(d)+'\')">'+DP_ICON_EDIT+'</button>'
      + '</div>'
    + '</div>';
  }).join('');
}
function dpEditOpen(dept){
  showNavToast('Edit department permissions', 'Editor for "' + dept + '" is coming soon.');
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', dpRender);
else dpRender();
</script>

<!-- PRODUCT SWITCHER -->
<script>
(function(){
  function portalSwitcher(){ var ps = document.getElementById('product-switcher'); if(ps && ps.parentElement !== document.body) document.body.appendChild(ps); }
  function positionSwitcher(){ var logo = document.querySelector('.logo'), ps = document.getElementById('product-switcher'); if(!logo || !ps) return; var r = logo.getBoundingClientRect(); ps.style.left = ((window.innerWidth > 640) ? 66 : r.left) + 'px'; ps.style.top = (r.bottom + 8) + 'px'; }
  function toggleProductSwitcher(e){ if(e) e.stopPropagation(); var logo = document.querySelector('.logo'), ps = document.getElementById('product-switcher'); if(!logo || !ps) return; portalSwitcher(); var w = !ps.classList.contains('ps-open'); if(w) positionSwitcher(); ps.classList.toggle('ps-open', w); logo.classList.toggle('ps-open', w); }
  function closeProductSwitcher(){ var logo = document.querySelector('.logo'), ps = document.getElementById('product-switcher'); if(logo) logo.classList.remove('ps-open'); if(ps) ps.classList.remove('ps-open'); }
  window.toggleProductSwitcher = toggleProductSwitcher;
  window.closeProductSwitcher = closeProductSwitcher;
  function init(){ portalSwitcher(); document.querySelectorAll('.ps-item').forEach(function(a){ a.classList.toggle('ps-active', a.getAttribute('data-pid') === 'coreconnect'); }); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  document.addEventListener('mousedown', function(e){ var ps = document.getElementById('product-switcher'); if(!ps || !ps.classList.contains('ps-open')) return; if(e.target.closest && (e.target.closest('.logo') || e.target.closest('#product-switcher'))) return; closeProductSwitcher(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeProductSwitcher(); });
  window.addEventListener('resize', function(){ var ps = document.getElementById('product-switcher'); if(ps && ps.classList.contains('ps-open')) positionSwitcher(); });
  window.addEventListener('scroll', function(){ var ps = document.getElementById('product-switcher'); if(ps && ps.classList.contains('ps-open')) positionSwitcher(); }, true);
})();
</script>
