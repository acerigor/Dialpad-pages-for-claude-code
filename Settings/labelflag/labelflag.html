<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.notif-panel{display:none;position:fixed;top:64px;right:24px;width:420px;max-height:560px;background:var(--sur);border:0.5px solid var(--brd);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);z-index:70;flex-direction:column;overflow:hidden;}
.notif-panel.open{display:flex;}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
.notif-title{font-size:14px;font-weight:600;color:var(--tx);}
.notif-header-actions{display:flex;align-items:center;gap:6px;}
.notif-markall{background:transparent;border:none;color:var(--ac2);font-family:var(--font);font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer;}
.notif-markall:hover{background:rgba(79,124,255,.10);}
.notif-markall[disabled]{opacity:.4;cursor:not-allowed;}
.notif-markall[disabled]:hover{background:transparent;}
.notif-close{display:none;width:36px;height:36px;border-radius:8px;background:transparent;border:none;color:var(--mu);cursor:pointer;align-items:center;justify-content:center;}
.notif-close:hover{background:rgba(255,255,255,.05);color:var(--tx);}
.notif-tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
.notif-tab{background:transparent;border:none;color:var(--mu);font-family:var(--font);font-size:12.5px;padding:8px 10px;border-bottom:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.notif-tab:hover{color:var(--tx);}
.notif-tab.active{color:var(--ac2);border-bottom-color:var(--ac);}
.notif-tab-count{font-family:var(--mono);font-size:10.5px;color:var(--mu);background:var(--sur2);padding:2px 6px;border-radius:8px;}
.notif-tab.active .notif-tab-count{color:var(--ac2);background:rgba(79,124,255,.16);}
.notif-body{overflow-y:auto;flex:1;min-height:120px;}
.notif-empty{padding:40px 20px;text-align:center;color:var(--mu);font-size:12.5px;}
.notif-group{padding:0 0 6px;}
.notif-group-head{font-size:10.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;padding:12px 18px 6px;}
.notif-item{display:flex;gap:12px;padding:10px 18px;cursor:pointer;position:relative;border-bottom:0.5px solid rgba(255,255,255,.03);}
.notif-item:hover{background:var(--sur2);}
.notif-item.unread{background:rgba(79,124,255,.04);}
.notif-item.unread:hover{background:rgba(79,124,255,.08);}
.notif-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sur2);color:var(--mu);}
.notif-icon svg{width:16px;height:16px;}
.notif-icon.new_lead{background:rgba(79,124,255,.14);color:var(--ac2);}
.notif-icon.engagement{background:rgba(34,200,138,.14);color:var(--gr);}
.notif-icon.reminder{background:rgba(245,166,35,.14);color:var(--am);}
.notif-icon.status_change{background:rgba(20,184,166,.14);color:#2dd4bf;}
.notif-icon.assignment{background:rgba(167,139,250,.14);color:#c4b5fd;}
.notif-text{flex:1;min-width:0;}
.notif-item-title{font-size:12.5px;font-weight:500;color:var(--tx);line-height:1.35;}
.notif-item.unread .notif-item-title{font-weight:600;}
.notif-item-body{font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.4;}
.notif-item-time{font-family:var(--mono);font-size:10.5px;color:var(--mu);margin-top:4px;}
.notif-unread-dot{position:absolute;top:18px;right:18px;width:7px;height:7px;border-radius:50%;background:var(--ac);}
.notif-footer{padding:8px;border-top:0.5px solid var(--brd);flex-shrink:0;}
.notif-seeall{width:100%;background:transparent;border:none;color:var(--ac2);font-family:var(--font);font-size:12.5px;padding:9px;border-radius:8px;cursor:pointer;}
.notif-seeall:hover{background:rgba(79,124,255,.08);}

/* ===== LABEL FLAG PAGE ===== */
.lf-head-spacer{flex:1;}
.lf-srch{width:240px;}
.lf-table-wrap{background:var(--sur);border:0.5px solid var(--brd2);border-radius:12px;overflow:hidden;}
.lf-table{width:100%;border-collapse:collapse;font-size:13px;}
.lf-table thead th{padding:12px 16px;text-align:left;color:var(--mu);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;border-bottom:0.5px solid var(--brd);white-space:nowrap;background:var(--sur);}
.lf-table tbody tr{border-bottom:0.5px solid var(--brd);cursor:pointer;transition:background .12s;}
.lf-table tbody tr:last-child{border-bottom:none;}
.lf-table tbody tr:hover{background:var(--sur2);}
.lf-table tbody td{padding:12px 16px;vertical-align:middle;color:var(--tx);}
.lf-td-name{display:flex;align-items:center;gap:10px;font-weight:500;}
.lf-td-name .lf-dot{width:12px;height:12px;border-radius:50%;flex:none;}
.lf-empty-row{cursor:default !important;}
.lf-empty-row:hover{background:transparent !important;}
.lf-empty-cell{padding:48px 20px !important;text-align:center;color:var(--mu);}
.lf-palette{display:flex;flex-wrap:wrap;gap:10px;}
.lf-sw{width:28px;height:28px;border-radius:50%;cursor:pointer;position:relative;border:2px solid transparent;transition:transform .12s,border-color .12s;}
.lf-sw:hover{transform:scale(1.08);}
.lf-sw.on{border-color:var(--tx);}
.lf-sw.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4);}
.lf-modal-del{margin-right:auto;}
.lf-modal-del:hover{border-color:var(--rd);color:var(--rd);}
#lf-modal .modal-save[disabled]{opacity:.5;cursor:not-allowed;background:var(--ac);}
#lf-modal .modal-save[disabled]:hover{background:var(--ac);}
.lf-empty{padding:48px 20px;text-align:center;color:var(--mu);font-size:13px;
  background:var(--sur);border:0.5px solid var(--brd2);border-radius:12px;}
/* Mobile search overlay */
.mobile-search-toggle{display:none;position:relative;}
.mobile-search-toggle.has-query::after{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--sur);}
.mso{position:fixed;top:0;left:0;right:0;height:60px;background:var(--bg);z-index:200;display:none;flex-direction:column;transform:translateY(-100%);transition:transform .18s ease-out;box-shadow:0 1px 0 var(--brd);}
.mso.open{display:flex;transform:translateY(0);}
.mso-header{display:flex;align-items:center;gap:6px;height:60px;padding:0 8px 0 4px;flex-shrink:0;}
.mso-back{width:40px;height:40px;flex-shrink:0;background:transparent;border:none;cursor:pointer;color:var(--mu);display:flex;align-items:center;justify-content:center;border-radius:8px;transition:color .12s,background .12s;}
.mso-back:hover,.mso-back:active{color:var(--tx);background:var(--sur2);}
.mso-back svg{width:20px;height:20px;}
.mso-input-wrap{flex:1;display:flex;align-items:center;gap:8px;min-width:0;}
.mso-input-wrap input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-family:var(--font);font-size:16px;font-weight:400;padding:0;min-width:0;}
.mso-input-wrap input::placeholder{color:var(--mu);}
.mso-clear{width:32px;height:32px;flex-shrink:0;background:transparent;border:none;cursor:pointer;color:var(--mu);display:none;align-items:center;justify-content:center;border-radius:50%;transition:color .12s,background .12s;}
.mso-clear.show{display:flex;}
.mso-clear:hover,.mso-clear:active{color:var(--tx);background:var(--sur2);}
.mso-clear svg{width:16px;height:16px;}
body.mso-active{overflow:hidden;}
body.mso-active .top-header{visibility:hidden;}
body.mso-active .set-page-head{display:none;}
/* Mobile kebab */
.mobile-kebab-btn{display:none;}
.lf-dd{position:relative;}
.lf-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:240px;background:var(--sur);border:0.5px solid var(--brd2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:4px;z-index:60;display:none;}
.lf-menu.open{display:block;}
.lf-menu .lf-mi{display:flex;align-items:center;gap:10px;padding:9px 12px;color:var(--tx);font-family:var(--font);font-size:13px;cursor:pointer;border-radius:6px;background:transparent;border:none;width:100%;text-align:left;}
.lf-menu .lf-mi:hover{background:var(--sur2);color:var(--ac2);}
.lf-menu .lf-mi svg{width:14px;height:14px;color:var(--mu);flex:none;}
.lf-menu .lf-mi:hover svg{color:var(--ac2);}
@media (max-width:640px){
  .set-page-head{flex-wrap:nowrap;gap:6px;}
  .lf-head-spacer{display:none;}
  .lf-srch{display:none;}
  .ur-back span{display:none;}
  #lf-add-btn{display:none;}
  .mobile-search-toggle{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;gap:0;margin-left:auto;background:var(--sur);border:0.5px solid var(--brd2);border-radius:8px;color:var(--tx);cursor:pointer;}
  .mobile-search-toggle svg{width:18px;height:18px;}
  .mobile-kebab-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;gap:0;background:var(--sur);border:0.5px solid var(--brd2);border-radius:8px;color:var(--tx);cursor:pointer;}
  .mobile-kebab-btn svg{width:18px;height:18px;}
}
</style>

  };
  if(routes[label]){ window.location.href = routes[label]; return; }
  showNavToast(label + ' is coming soon', 'This feature is under construction.');
}
function toggleMobileDrawer(){
  var d = document.getElementById('mobile-drawer'), b = document.getElementById('mobile-drawer-backdrop');
  if(!d || !b) return;
  if(d.classList.contains('open')) closeMobileDrawer();
  else { d.classList.add('open'); b.classList.add('open'); }
}
function closeMobileDrawer(){
  var d = document.getElementById('mobile-drawer'), b = document.getElementById('mobile-drawer-backdrop');
  if(d) d.classList.remove('open'); if(b) b.classList.remove('open');
}
var navToastTimer = null;
function showNavToast(title, body){
  var t = document.getElementById('nav-toast'); if(!t) return;
  if(title) document.getElementById('nav-toast-title').textContent = title;
  if(body)  document.getElementById('nav-toast-body').textContent  = body;
  t.classList.add('show');
  if(navToastTimer) clearTimeout(navToastTimer);
  navToastTimer = setTimeout(hideNavToast, 4000);
}
function hideNavToast(){
  var t = document.getElementById('nav-toast'); if(t) t.classList.remove('show');
  if(navToastTimer){ clearTimeout(navToastTimer); navToastTimer = null; }
}
/* Notifications bell — shared/notifications.js wraps openNotifications + drives setNotifTab/markAll. */
function toggleNotifications(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('notif-panel'); if(!panel) return;
  if(panel.classList.contains('open')) closeNotifications(); else openNotifications();
}
function openNotifications(){
  var panel = document.getElementById('notif-panel'), bell = document.getElementById('header-bell');
  if(!panel || !bell) return;
  if(panel.parentElement !== document.body) document.body.appendChild(panel);
  positionNotifications();
  panel.classList.add('open'); bell.classList.add('active');
}
function closeNotifications(){
  var panel = document.getElementById('notif-panel'), bell = document.getElementById('header-bell');
  if(panel) panel.classList.remove('open'); if(bell) bell.classList.remove('active');
}
function positionNotifications(){
  var panel = document.getElementById('notif-panel'), bell = document.getElementById('header-bell');
  if(!panel || !bell) return;
  var r = bell.getBoundingClientRect(), gap = 8;
  var wasOpen = panel.classList.contains('open');
  if(!wasOpen){ panel.style.visibility = 'hidden'; panel.style.display = 'flex'; }
  var panelH = panel.offsetHeight || 480, panelW = panel.offsetWidth || 380;
  if(!wasOpen){ panel.style.display = ''; panel.style.visibility = ''; }
  var spaceBelow = window.innerHeight - r.bottom;
  var openAbove = spaceBelow < panelH + gap + 8 && r.top > panelH + gap + 8;
  panel.style.top = openAbove ? Math.max(8, r.top - panelH - gap) + 'px' : (r.bottom + gap) + 'px';
  panel.style.left = Math.max(8, r.right - panelW) + 'px';
}
document.addEventListener('click', function(e){
  var panel = document.getElementById('notif-panel'), bell = document.getElementById('header-bell');
  if(!panel || !panel.classList.contains('open')) return;
  if(bell && bell.contains(e.target)) return;
  if(panel.contains(e.target)) return;
  closeNotifications();
});
window.addEventListener('resize', function(){
  var panel = document.getElementById('notif-panel');
  if(panel && panel.classList.contains('open')) positionNotifications();
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeNotifications(); });

/* ===== Label Flag — shell state (list lands in a follow-up) ===== */
function lfEsc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var _lfQuery = '';
var LF_KEY = 'cc_lead_labels';
var lfItems = [];
function lfEsc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lfDefaults(){
  return [
    { id:'hot',      name:'Hot',       color:'#e85555' },
    { id:'warm',     name:'Warm',      color:'#f5a623' },
    { id:'cold',     name:'Cold',      color:'#4f7cff' },
    { id:'vip',      name:'VIP',       color:'#a78bfa' },
    { id:'followup', name:'Follow-up', color:'#22c88a' }
  ];
}
function lfLoad(){
  var s = null;
  try{ s = JSON.parse(localStorage.getItem(LF_KEY) || 'null'); }catch(e){}
  if(!Array.isArray(s)) s = lfDefaults();
  return s;
}
function lfFiltered(){
  var q = (_lfQuery || '').trim().toLowerCase();
  if(!q) return lfItems.slice();
  return lfItems.filter(function(it){ return String(it.name||'').toLowerCase().indexOf(q) >= 0; });
}
function lfRender(){
  var tbody = document.getElementById('lf-tbody'); if(!tbody) return;
  var rows = lfFiltered();
  if(!rows.length){
    var msg = _lfQuery ? 'No labels match your search.' : 'No labels yet — click "Add" to create one.';
    tbody.innerHTML = '<tr class="lf-empty-row"><td class="lf-empty-cell">'+lfEsc(msg)+'</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(it){
    return '<tr role="button" tabindex="0"'
      + ' onclick="lfRowClick(\''+lfEsc(it.id)+'\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();lfRowClick(\''+lfEsc(it.id)+'\');}">'
      + '<td><div class="lf-td-name"><span class="lf-dot" style="background:'+lfEsc(it.color||'#4f7cff')+';"></span>'+lfEsc(it.name)+'</div></td>'
    + '</tr>';
  }).join('');
}
function lfPersist(){ try{ localStorage.setItem(LF_KEY, JSON.stringify(lfItems)); }catch(e){} }
function lfRowClick(id){ lfModalOpen(id); }

/* ===== Add / Edit label modal ===== */
var LF_PALETTE = ['#4f7cff','#22c88a','#f5a623','#e85555','#a78bfa','#2dd4bf','#ec4899','#0ea5e9','#f97316','#64748b'];
var _lfEditId = null;
var _lfColor = LF_PALETTE[0];
var _lfSaved = null;
function lfPaletteRender(){
  var el = document.getElementById('lf-palette'); if(!el) return;
  el.innerHTML = LF_PALETTE.map(function(c){
    var on = (c.toLowerCase() === String(_lfColor||'').toLowerCase()) ? ' on' : '';
    return '<span class="lf-sw'+on+'" role="button" tabindex="0" aria-label="'+c+'" data-color="'+c+'" style="background:'+c+';" onclick="lfPickColor(\''+c+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();lfPickColor(\''+c+'\');}"></span>';
  }).join('');
}
function lfPickColor(c){ _lfColor = c; lfPaletteRender(); lfSyncDirty(); }
function lfBuildPayload(){
  return { name: (document.getElementById('lf-f-name').value || '').trim(), color: _lfColor };
}
function lfSyncDirty(){
  var btn = document.getElementById('lf-modal-save'); if(!btn) return;
  if(!_lfSaved){ btn.disabled = true; return; }
  var cur = lfBuildPayload();
  var same = cur.name === _lfSaved.name && cur.color === _lfSaved.color;
  btn.disabled = same || (!_lfEditId && !cur.name);
}
function _lfSlug(s){ return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function lfModalOpen(id){
  var m = document.getElementById('lf-modal'); if(!m) return;
  _lfEditId = (typeof id === 'string' && id) ? id : null;
  var row = _lfEditId ? lfItems.filter(function(x){return x.id === _lfEditId;})[0] : null;
  document.getElementById('lf-modal-title').textContent = row ? 'Edit Label' : 'Add Label';
  document.getElementById('lf-modal-save').textContent = row ? 'Update' : 'Save';
  var del = document.getElementById('lf-modal-delete'); if(del) del.hidden = !row;
  document.getElementById('lf-f-name').value = row ? (row.name || '') : '';
  _lfColor = row ? (row.color || LF_PALETTE[0]) : LF_PALETTE[0];
  lfPaletteRender();
  m.classList.add('open');
  _lfSaved = lfBuildPayload();
  lfSyncDirty();
  setTimeout(function(){ var n = document.getElementById('lf-f-name'); if(n) n.focus(); }, 20);
}
function lfModalClose(){
  var m = document.getElementById('lf-modal'); if(m) m.classList.remove('open');
  _lfSaved = null;
}
function lfModalSave(){
  var payload = lfBuildPayload();
  if(!payload.name){ document.getElementById('lf-f-name').focus(); return; }
  var wasNew = !_lfEditId;
  if(wasNew){
    var baseId = _lfSlug(payload.name) || ('lbl-' + Date.now());
    var newId = baseId, n = 2;
    while(lfItems.some(function(x){return x.id === newId;})) newId = baseId + '-' + (n++);
    lfItems.push({ id: newId, name: payload.name, color: payload.color });
    _lfEditId = newId;
    document.getElementById('lf-modal-title').textContent = 'Edit Label';
    document.getElementById('lf-modal-save').textContent = 'Update';
    var del = document.getElementById('lf-modal-delete'); if(del) del.hidden = false;
  } else {
    var row = lfItems.filter(function(x){return x.id === _lfEditId;})[0];
    if(row){ row.name = payload.name; row.color = payload.color; }
  }
  lfPersist(); lfRender();
  _lfSaved = payload;
  lfSyncDirty();
  showNavToast(wasNew ? 'Label added' : 'Label updated', payload.name + ' was saved.');
}
function lfModalDelete(){
  if(!_lfEditId) return;
  var id = _lfEditId, row = lfItems.filter(function(x){return x.id === id;})[0];
  lfItems = lfItems.filter(function(x){return x.id !== id;});
  lfPersist(); lfRender(); lfModalClose();
  showNavToast('Label deleted', (row ? row.name : 'Label') + ' was removed.');
  _lfEditId = null;
}
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  var mo = document.getElementById('lf-modal');
  if(mo && mo.classList.contains('open')) lfModalClose();
});
(function lfInit(){
  function run(){ lfItems = lfLoad(); lfRender(); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
function lfSearch(v){
  _lfQuery = String(v || '');
  lfRender();
}
/* Mobile search overlay */
function _msoEl(){ return document.getElementById('mso'); }
function _msoInput(){ return document.getElementById('mso-input'); }
function _msoClearBtn(){ return document.getElementById('mso-clear'); }
function _msoToggleBtn(){ return document.getElementById('mobile-search-toggle'); }
function msoUpdateDot(){ var b=_msoToggleBtn(); if(!b) return; if(_lfQuery && _lfQuery.length) b.classList.add('has-query'); else b.classList.remove('has-query'); }
function msoUpdateClear(){ var i=_msoInput(),c=_msoClearBtn(); if(!i||!c) return; if(i.value && i.value.length) c.classList.add('show'); else c.classList.remove('show'); }
function msoOnInput(v){ var d=document.getElementById('lf-search-input'); if(d) d.value=v; lfSearch(v); msoUpdateClear(); msoUpdateDot(); }
function msoClearInput(){ var i=_msoInput(); if(!i) return; i.value=''; msoOnInput(''); i.focus(); }
function toggleMobileSearch(){ var o=_msoEl(),i=_msoInput(); if(!o||!i) return; i.value=_lfQuery||''; msoUpdateClear(); document.body.classList.add('mso-active'); o.classList.add('open'); setTimeout(function(){ i.focus(); },60); }
function closeMobileSearch(){ var o=_msoEl(); if(!o||!o.classList.contains('open')) return; o.classList.remove('open'); document.body.classList.remove('mso-active'); var i=_msoInput(); if(i) i.blur(); msoUpdateDot(); }
function lfKebabToggle(e){ if(e) e.stopPropagation(); var m=document.getElementById('lf-kebab-menu'),b=document.getElementById('lf-kebab-btn'); if(!m||!b) return; var o=m.classList.toggle('open'); b.classList.toggle('open',o); }
function lfKebabClose(){ var m=document.getElementById('lf-kebab-menu'),b=document.getElementById('lf-kebab-btn'); if(m) m.classList.remove('open'); if(b) b.classList.remove('open'); }
function lfKebabPick(k){ lfKebabClose(); if(k==='add') lfAddOpen(); }
document.addEventListener('mousedown', function(e){ if(!e.target.closest) return; if(!e.target.closest('#lf-kebab-dd')) lfKebabClose(); });
document.addEventListener('keydown', function(e){ if(e.key!=='Escape') return; var o=document.getElementById('mso'); if(o && o.classList.contains('open')){ closeMobileSearch(); return; } lfKebabClose(); });
function lfAddOpen(){ lfModalOpen(null); }
</script>

<script>
(function(){
  function portalSwitcher(){ var ps = document.getElementById('product-switcher'); if(ps && ps.parentElement !== document.body) document.body.appendChild(ps); }
  function positionSwitcher(){ var logo = document.querySelector('.logo'), ps = document.getElementById('product-switcher'); if(!logo || !ps) return; var r = logo.getBoundingClientRect(); ps.style.left = ((window.innerWidth > 640) ? 66 : r.left) + 'px'; ps.style.top = (r.bottom + 8) + 'px'; }
  function toggleProductSwitcher(e){ if(e) e.stopPropagation(); var logo = document.querySelector('.logo'), ps = document.getElementById('product-switcher'); if(!logo || !ps) return; portalSwitcher(); var w = !ps.classList.contains('ps-open'); if(w) positionSwitcher(); ps.classList.toggle('ps-open', w); logo.classList.toggle('ps-open', w); }
  function closeProductSwitcher(){ var logo = document.querySelector('.logo'), ps = document.getElementById('product-switcher'); if(logo) logo.classList.remove('ps-open'); if(ps) ps.classList.remove('ps-open'); }
  window.toggleProductSwitcher = toggleProductSwitcher;
  window.closeProductSwitcher = closeProductSwitcher;
  function init(){ portalSwitcher(); document.querySelectorAll('.ps-item').forEach(function(a){ a.classList.toggle('ps-active', a.getAttribute('data-pid') === 'coreconnect'); }); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  document.addEventListener('mousedown', function(e){ var ps = document.getElementById('product-switcher'); if(!ps || !ps.classList.contains('ps-open')) return; if(e.target.closest && (e.target.closest('.logo') || e.target.closest('#product-switcher'))) return; closeProductSwitcher(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeProductSwitcher(); });
  window.addEventListener('resize', function(){ var ps = document.getElementById('product-switcher'); if(ps && ps.classList.contains('ps-open')) positionSwitcher(); });
  window.addEventListener('scroll', function(){ var ps = document.getElementById('product-switcher'); if(ps && ps.classList.contains('ps-open')) positionSwitcher(); }, true);
})();
</script>
