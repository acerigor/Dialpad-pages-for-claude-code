<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }

/* Preferences */
.np-intro{padding:16px 24px;color:var(--mu);font-size:13px;border-bottom:0.5px solid var(--brd);}
.np-list{padding:16px 24px 24px;display:flex;flex-direction:column;gap:8px;max-width:820px;margin:0 auto;width:100%;}
.np-row{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--sur);border:0.5px solid var(--brd2);border-radius:10px;cursor:pointer;transition:background .12s,border-color .12s;}
.np-row:hover{background:var(--sur2);border-color:rgba(255,255,255,.14);}
.np-ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.np-ic.info{background:rgba(79,124,255,.14);color:var(--ac2);}
.np-ic.ok  {background:rgba(34,200,138,.14);color:var(--gr);}
.np-ic.warn{background:rgba(245,166,35,.15);color:var(--am);}
.np-ic.err {background:rgba(232,85,85,.16);color:var(--rd);}
.np-ic svg{width:18px;height:18px;}
.np-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.np-title{font-size:13.5px;font-weight:600;color:var(--tx);}
.np-sub{font-size:12.5px;color:var(--mu);line-height:1.45;}
/* Toggle switch */
.np-switch{position:relative;width:36px;height:20px;flex:none;}
.np-switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2;}
.np-switch-track{position:absolute;inset:0;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:99px;transition:background .12s,border-color .12s;}
.np-switch-track::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--mu);border-radius:50%;transition:transform .15s,background .12s;}
.np-switch input:checked + .np-switch-track{background:var(--ac);border-color:var(--ac);}
.np-switch input:checked + .np-switch-track::after{transform:translateX(16px);background:#fff;}
/* Sticky footer */
.np-footer{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;background:var(--bg);border-top:0.5px solid var(--brd);z-index:10;}
.np-footer button[disabled]{opacity:.4;cursor:not-allowed;}
.np-empty{padding:60px 20px;text-align:center;color:var(--mu);font-size:13px;background:var(--sur);border:0.5px dashed var(--brd2);border-radius:12px;max-width:520px;margin:24px auto;}
.np-empty-icon{font-size:36px;opacity:.5;margin-bottom:10px;}

/* Ur head + notif panel */
.ur-head-spacer{flex:1;}
.notif-panel{display:none;position:fixed;top:64px;right:24px;width:420px;max-height:560px;background:var(--sur);border:0.5px solid var(--brd);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);z-index:70;flex-direction:column;overflow:hidden;}
.notif-panel.open{display:flex;}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
.notif-title{font-size:14px;font-weight:600;color:var(--tx);}
.notif-header-actions{display:flex;align-items:center;gap:6px;}
.notif-markall{background:transparent;border:none;color:var(--ac2);font-family:var(--font);font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer;}
.notif-close{display:none;}
.notif-tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
.notif-tab{background:transparent;border:none;color:var(--mu);font-family:var(--font);font-size:12.5px;padding:8px 10px;border-bottom:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.notif-tab.active{color:var(--ac2);border-bottom-color:var(--ac);}
.notif-tab-count{font-family:var(--mono);font-size:10.5px;color:var(--mu);background:var(--sur2);padding:2px 6px;border-radius:8px;}
.notif-body{overflow-y:auto;flex:1;min-height:120px;}
.notif-footer{padding:8px;border-top:0.5px solid var(--brd);flex-shrink:0;}
.notif-seeall{width:100%;background:transparent;border:none;color:var(--ac2);font-family:var(--font);font-size:12.5px;padding:9px;border-radius:8px;cursor:pointer;}

@media (max-width:640px){
  .np-intro{padding:12px 16px;}
  .np-list{padding:12px 16px 20px;}
  .np-footer{padding:12px 16px;}
}
</style>

function navClick(label){
  if(label === 'Settings'){ window.location.href = '../Settings_main_page/coreconnect_settings.html'; return; }
  var routes = {
    'Home':'../../coreconnect_dashboard_v41/coreconnect_dashboard_v41.html',
    'CRM':'../../coreconnect_leads_v83/coreconnect_leads_v83.html',
    'Call':'../../call_history/coreconnect_call_history_v31.html',
    'Message':'../../coreconnect_message_history_v41/coreconnect_message_history_v41.html',
    'Voice mail':'../../coreconnect_voicemail_history_v9/coreconnect_voicemail_history_v9.html',
    'Appointments':'../../coreconnect_appointments/coreconnect_appointments.html'
  };
  if(routes[label]){ window.location.href = routes[label]; return; }
  showNavToast(label + ' is coming soon', 'This feature is under construction.');
}
function toggleMobileDrawer(){ var d=document.getElementById('mobile-drawer'),b=document.getElementById('mobile-drawer-backdrop'); if(!d||!b) return; if(d.classList.contains('open')) closeMobileDrawer(); else { d.classList.add('open'); b.classList.add('open'); } }
function closeMobileDrawer(){ var d=document.getElementById('mobile-drawer'),b=document.getElementById('mobile-drawer-backdrop'); if(d) d.classList.remove('open'); if(b) b.classList.remove('open'); }
var navToastTimer = null;
function showNavToast(title, body){ var t=document.getElementById('nav-toast'); if(!t) return; if(title) document.getElementById('nav-toast-title').textContent=title; if(body) document.getElementById('nav-toast-body').textContent=body; t.classList.add('show'); if(navToastTimer) clearTimeout(navToastTimer); navToastTimer=setTimeout(hideNavToast,4000); }
function hideNavToast(){ var t=document.getElementById('nav-toast'); if(t) t.classList.remove('show'); if(navToastTimer){ clearTimeout(navToastTimer); navToastTimer=null; } }

  { key:'status',       variant:'info', title:'Status change',          sub:'Fires when an application moves between funnel stages (Submitted → Under Review → Approved → Funded).' },
  { key:'payment_due',  variant:'warn', title:'Payment due',            sub:'Fires 24h before an installment is drafted from the customer\'s account.' },
  { key:'repo',         variant:'err',  title:'Repossession alert',     sub:'Fires when a delinquent account crosses the repo trigger threshold.' },
  { key:'aging',        variant:'warn', title:'Application aging',      sub:'Fires when an application has been open more than 3 days without action.' }
];

function npEsc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function npAllOn(){ var out = {}; NP_CATEGORIES.forEach(function(c){ out[c.key] = true; }); return out; }
function npLoad(userKey){
  try{
    var raw = localStorage.getItem(NP_KEY);
    var p = raw ? JSON.parse(raw) : null;
    if(p && p.ver === NP_VER && p.map && p.map[userKey]){
      var saved = p.map[userKey], out = {};
      NP_CATEGORIES.forEach(function(c){ out[c.key] = saved[c.key] !== undefined ? !!saved[c.key] : true; });
      return out;
    }
  }catch(e){}
  return npAllOn();
}
function npPersist(userKey, prefs){
  try{
    var raw = localStorage.getItem(NP_KEY);
    var p = raw ? JSON.parse(raw) : null;
    if(!p || p.ver !== NP_VER || !p.map) p = { ver:NP_VER, map:{} };
    p.map[userKey] = prefs;
    localStorage.setItem(NP_KEY, JSON.stringify(p));
  }catch(e){}
}
function npResolveUser(userKey){
  if(!window.CCLeads || !Array.isArray(CCLeads.TEAM)) return null;
  for(var i=0;i<CCLeads.TEAM.length;i++){ if(CCLeads.TEAM[i].key === userKey) return CCLeads.TEAM[i]; }
  return null;
}
function npReadUserFromUrl(){
  var m = /[?&]user=([^&#]+)/.exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
function npReadDeptFromUrl(){
  var m = /[?&]dept=([^&#]+)/.exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
function npResolveDept(name){
  if(!name || !window.CCLeads || !Array.isArray(CCLeads.TEAM)) return null;
  for(var i=0;i<CCLeads.TEAM.length;i++){ if((CCLeads.TEAM[i].dept || '') === name) return name; }
  return null;
}
function npDirty(){ return JSON.stringify(_npDraft) !== JSON.stringify(_npSaved); }
function npRefreshFooter(){
  var dirty = npDirty();
  var save = document.getElementById('np-save'); if(save) save.disabled = !dirty;
  var cancel = document.getElementById('np-cancel'); if(cancel) cancel.disabled = !dirty;
}
function npRender(){
  var host = document.getElementById('np-list'); if(!host) return;
  host.innerHTML = NP_CATEGORIES.map(function(c){
    var on = !!_npDraft[c.key];
    return '<label class="np-row">'
      + '<div class="np-ic '+c.variant+'">'+NP_ICONS[c.key]+'</div>'
      + '<div class="np-txt"><div class="np-title">'+npEsc(c.title)+'</div><div class="np-sub">'+npEsc(c.sub)+'</div></div>'
      + '<span class="np-switch"><input type="checkbox" data-cat="'+npEsc(c.key)+'"'+(on?' checked':'')+' onchange="npToggle(\''+npEsc(c.key)+'\', this.checked)"/><span class="np-switch-track"></span></span>'
      + '</label>';
  }).join('');
  npRefreshFooter();
}
function npToggle(key, on){
  _npDraft[key] = !!on;
  npRefreshFooter();
}
function npSave(){
  if(!npDirty()) return;
  npPersist(_npUser, _npDraft);
  _npSaved = Object.assign({}, _npDraft);
  npRefreshFooter();
  showNavToast('Preferences saved', 'Notification preferences updated.');
}
function npCancel(){
  if(!npDirty()) return;
  _npDraft = Object.assign({}, _npSaved);
  npRender();
}
(function npInit(){
  var boot = function(){
    var title = document.getElementById('np-page-title');
    // Department preferences page: notifications.html?dept=<Name>
    var deptName = npReadDeptFromUrl();
    if(deptName){
      var d = npResolveDept(deptName);
      if(!d){
        if(title) title.textContent = 'Notification Preferences';
        var dintro = document.getElementById('np-intro'); if(dintro) dintro.style.display = 'none';
        document.getElementById('np-list').innerHTML = '<div class="np-empty"><div class="np-empty-icon">🏢</div><div>Unknown department.</div><div style="margin-top:6px;font-size:12px;">This page expects a <code>?dept=&lt;Name&gt;</code> URL param matching a team department.</div></div>';
        return;
      }
      _npUser = 'dept:' + d;
      if(title) title.textContent = 'Notification Preferences — ' + d + ' (Department)';
      document.title = 'Notification Preferences — ' + d;
      _npSaved = npLoad(_npUser);
      _npDraft = Object.assign({}, _npSaved);
      npRender();
      return;
    }
    _npUser = npReadUserFromUrl();
    var member = npResolveUser(_npUser);
    if(!member){
      if(title) title.textContent = 'Notification Preferences';
      var intro = document.getElementById('np-intro'); if(intro) intro.style.display = 'none';
      document.getElementById('np-list').innerHTML = '<div class="np-empty"><div class="np-empty-icon">👤</div><div>Unknown recipient.</div><div style="margin-top:6px;font-size:12px;">This page expects a <code>?user=&lt;KEY&gt;</code> URL param matching a team member.</div></div>';
      return;
    }
    if(title) title.textContent = 'Notification Preferences — ' + member.name;
    document.title = 'Notification Preferences — ' + member.name;
    _npSaved = npLoad(_npUser);
    _npDraft = Object.assign({}, _npSaved);
    npRender();
  };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script>
(function(){
  function portalSwitcher(){ var ps=document.getElementById('product-switcher'); if(ps && ps.parentElement!==document.body) document.body.appendChild(ps); }
  function positionSwitcher(){ var logo=document.querySelector('.logo'),ps=document.getElementById('product-switcher'); if(!logo||!ps) return; var r=logo.getBoundingClientRect(); ps.style.left=((window.innerWidth>640)?66:r.left)+'px'; ps.style.top=(r.bottom+8)+'px'; }
  function toggleProductSwitcher(e){ if(e) e.stopPropagation(); var logo=document.querySelector('.logo'),ps=document.getElementById('product-switcher'); if(!logo||!ps) return; portalSwitcher(); var w=!ps.classList.contains('ps-open'); if(w) positionSwitcher(); ps.classList.toggle('ps-open',w); logo.classList.toggle('ps-open',w); }
  function closeProductSwitcher(){ var logo=document.querySelector('.logo'),ps=document.getElementById('product-switcher'); if(logo) logo.classList.remove('ps-open'); if(ps) ps.classList.remove('ps-open'); }
  window.toggleProductSwitcher = toggleProductSwitcher;
  window.closeProductSwitcher = closeProductSwitcher;
  function init(){ portalSwitcher(); document.querySelectorAll('.ps-item').forEach(function(a){ a.classList.toggle('ps-active', a.getAttribute('data-pid') === 'coreconnect'); }); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  document.addEventListener('mousedown', function(e){ var ps=document.getElementById('product-switcher'); if(!ps || !ps.classList.contains('ps-open')) return; if(e.target.closest && (e.target.closest('.logo') || e.target.closest('#product-switcher'))) return; closeProductSwitcher(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeProductSwitcher(); });
})();
</script>

<script>
function toggleNotifications(e){ if(e) e.stopPropagation(); var p=document.getElementById('notif-panel'); if(!p) return; if(p.classList.contains('open')) closeNotifications(); else openNotifications(); }
function openNotifications(){ var p=document.getElementById('notif-panel'),b=document.getElementById('header-bell'); if(!p||!b) return; if(p.parentElement!==document.body) document.body.appendChild(p); positionNotifications(); p.classList.add('open'); b.classList.add('active'); }
function closeNotifications(){ var p=document.getElementById('notif-panel'),b=document.getElementById('header-bell'); if(p) p.classList.remove('open'); if(b) b.classList.remove('active'); }
function positionNotifications(){ var p=document.getElementById('notif-panel'),b=document.getElementById('header-bell'); if(!p||!b) return; var r=b.getBoundingClientRect(); var w=p.offsetWidth||420; p.style.top=(r.bottom+8)+'px'; p.style.left=Math.max(8, r.right-w)+'px'; }
function setNotifTab(t){ document.querySelectorAll('.notif-tab').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===t); }); }
function markAllNotificationsRead(){}
document.addEventListener('click', function(e){ var p=document.getElementById('notif-panel'),b=document.getElementById('header-bell'); if(p && p.classList.contains('open') && !(b&&b.contains(e.target)) && !p.contains(e.target)) closeNotifications(); });
</script>
