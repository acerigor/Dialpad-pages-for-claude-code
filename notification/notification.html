<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreConnect — Notifications</title>
<link rel="stylesheet" href="../shared/app.css">
<link rel="stylesheet" href="../shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);margin:0;padding:0;font-family:'DM Sans',sans-serif;}
body{color:var(--tx);line-height:1.5;-webkit-font-smoothing:antialiased;}

/* ===== NOTIF PANEL (page bell dropdown — same as other pages) ===== */
.notif-panel{display:none;position:fixed;top:0;left:0;width:420px;max-height:560px;
  background:var(--sur);border:0.5px solid var(--brd2);border-radius:12px;
  box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:9100;flex-direction:column;overflow:hidden;}
.notif-panel.open{display:flex;}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid var(--brd);}
.notif-title{font-size:14px;font-weight:600;color:var(--tx);}
.notif-header-actions{display:flex;gap:8px;align-items:center;}
.notif-markall{background:none;border:none;color:var(--ac2);cursor:pointer;font-family:var(--font);font-size:12.5px;}
.notif-markall:disabled{opacity:.4;cursor:default;}
.notif-close{background:none;border:none;color:var(--mu);cursor:pointer;display:flex;}
.notif-close:hover{color:var(--tx);}
.notif-tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
.notif-tab{background:none;border:none;color:var(--mu);padding:9px 12px;font-family:var(--font);font-size:12.5px;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;}
.notif-tab.active{color:var(--ac2);border-bottom-color:var(--ac);}
.notif-tab:hover{color:var(--tx);}
.notif-tab-count{background:var(--sur2);border-radius:999px;font-size:10.5px;min-width:18px;padding:0 6px;line-height:16px;color:var(--mu);}
.notif-tab.active .notif-tab-count{background:var(--ac);color:#fff;}
.notif-body{flex:1;overflow-y:auto;}
.notif-empty{padding:60px 20px;text-align:center;color:var(--mu);}
.notif-empty-icon{font-size:32px;margin-bottom:8px;opacity:.6;}
.notif-footer{padding:10px 16px;border-top:0.5px solid var(--brd);text-align:center;}
.notif-seeall{background:none;border:none;color:var(--ac2);cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500;width:100%;padding:6px;}
@media(max-width:640px){
  .notif-panel{top:0!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;max-height:none!important;height:100vh;border-radius:0;border:none;}
}

/* ===== NLOG PAGE ===== */
.nlog-page{margin-left:64px;margin-top:64px;padding:0;height:calc(100vh - 64px);display:flex;flex-direction:column;overflow:hidden;}
@media(max-width:640px){ .nlog-page{margin-left:0;} }
.nlog-head{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:0.5px solid var(--brd);background:var(--bg);flex:none;}
.nlog-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;}
.nlog-period{display:inline-flex;align-items:center;gap:4px;padding:4px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;flex-shrink:0;}
button.nlog-period-mobile{display:none;align-items:center;gap:7px;}
.nlog-pm-chev{width:11px;height:11px;color:var(--mu);}
/* Mobile period drawer */
.nlog-pd-backdrop{position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:9100;}
.nlog-pd-backdrop.open{opacity:1;visibility:visible;}
.nlog-pd-drawer{position:fixed;top:64px;right:-100%;width:90%;max-width:380px;height:calc(100vh - 64px);background:var(--sur);border-left:0.5px solid var(--brd2);box-shadow:-12px 0 32px rgba(0,0,0,.4);transition:right .25s ease;z-index:9200;display:flex;flex-direction:column;}
.nlog-pd-drawer.open{right:0;}
.nlog-pd-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:0.5px solid var(--brd);}
.nlog-pd-title{font-size:15px;font-weight:600;color:var(--tx);}
.nlog-pd-close{background:none;border:none;color:var(--mu);cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.nlog-pd-close:hover{background:var(--sur2);color:var(--tx);}
.nlog-pd-list{display:flex;flex-direction:column;padding:8px 0;}
.nlog-pd-item{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:none;border:none;color:var(--tx);font-family:var(--font);font-size:14px;cursor:pointer;text-align:left;}
.nlog-pd-item:hover{background:var(--sur2);}
.nlog-pd-item.active{color:var(--ac2);}
.nlog-pd-item.active::after{content:'\2713';color:var(--ac2);font-size:14px;font-weight:700;}
.nlog-period-btn{display:flex;align-items:center;justify-content:center;min-height:32px;padding:0 16px;border-radius:7px;background:transparent;border:none;cursor:pointer;color:var(--mu);font-size:12.5px;font-weight:500;font-family:var(--font);transition:color .12s,background .12s;white-space:nowrap;}
.nlog-period-btn:hover{color:var(--tx);}
.nlog-period-btn.active{background:var(--ac);color:#fff;}
.nlog-period-btn.active:hover{color:#fff;}
.nlog-tb-btn{display:flex;align-items:center;gap:6px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;padding:0 13px;height:40px;color:var(--mu);font-family:var(--font);font-size:12.5px;cursor:pointer;transition:all .12s;position:relative;}
.nlog-tb-btn:hover{color:var(--ac2);border-color:var(--ac);}
.nlog-tb-btn.active{background:var(--ac);border-color:var(--ac);color:#fff;}
.nlog-tb-btn svg{width:15px;height:15px;}
.nlog-tb-btn-icon{padding:0;width:40px;justify-content:center;}
.nlog-tb-badge{background:var(--ac);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;min-width:18px;padding:0 5px;line-height:18px;}
.nlog-search{display:flex;align-items:center;gap:7px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;padding:0 13px;height:40px;width:240px;margin-left:auto;}
.nlog-search:focus-within{border-color:var(--ac);}
.nlog-search svg{width:14px;height:14px;color:var(--mu);flex:none;}
.nlog-search input{background:none;border:none;outline:none;color:var(--tx);font-family:var(--font);font-size:12.5px;width:100%;}
.nlog-search input::placeholder{color:var(--mu);}
/* Calendar popover */
.nlog-cal-pop{position:absolute;display:none;background:var(--sur);border:0.5px solid var(--brd2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:12px;z-index:9000;width:260px;}
.nlog-cal-pop.open{display:block;}
.nlog-cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;}
.nlog-cal-title{font-size:13px;font-weight:600;color:var(--tx);}
.nlog-cal-nav{background:none;border:none;color:var(--mu);cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.nlog-cal-nav:hover{background:var(--sur2);color:var(--tx);}
.nlog-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.nlog-cal-wd{font-size:10.5px;color:var(--mu);text-align:center;padding:4px 0;font-weight:600;text-transform:uppercase;}
.nlog-cal-day{background:none;border:none;color:var(--tx);cursor:pointer;font-family:var(--font);font-size:12px;height:30px;border-radius:6px;transition:all .1s;}
.nlog-cal-day.empty{visibility:hidden;}
.nlog-cal-day:hover:not(.empty):not(.selected){background:var(--sur2);}
.nlog-cal-day.today{color:var(--ac2);font-weight:700;}
.nlog-cal-day.selected{background:var(--ac);color:#fff;}
.nlog-cal-foot{display:flex;justify-content:space-between;padding-top:10px;border-top:0.5px solid var(--brd);margin-top:10px;}
.nlog-cal-clear{background:none;border:none;color:var(--mu);cursor:pointer;font-size:11.5px;font-family:var(--font);}
.nlog-cal-clear:hover{color:var(--ac2);}
/* Filter popover */
.nlog-fil-pop{position:absolute;display:none;background:var(--sur);border:0.5px solid var(--brd2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:14px;z-index:9000;width:300px;max-height:520px;overflow-y:auto;}
.nlog-fil-pop.open{display:block;}
.nlog-fil-sec{margin-bottom:14px;}
.nlog-fil-sec:last-of-type{margin-bottom:0;}
.nlog-fil-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);font-weight:600;margin-bottom:8px;}
.nlog-fil-chips{display:flex;flex-wrap:wrap;gap:5px;}
.nlog-fil-chip{background:var(--sur2);border:0.5px solid var(--brd2);border-radius:999px;padding:5px 10px;color:var(--mu);font-family:var(--font);font-size:11.5px;cursor:pointer;transition:all .12s;}
.nlog-fil-chip:hover{color:var(--ac2);border-color:var(--ac);}
.nlog-fil-chip.on{background:var(--ac);color:#fff;border-color:var(--ac);}
.nlog-fil-lead-wrap{position:relative;}
.nlog-fil-lead-input{width:100%;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:8px;color:var(--tx);font-family:var(--font);font-size:12.5px;padding:7px 11px;outline:none;}
.nlog-fil-lead-input:focus{border-color:var(--ac);}
.nlog-fil-lead-list{position:absolute;top:100%;left:0;right:0;background:var(--sur);border:0.5px solid var(--brd2);border-radius:8px;margin-top:4px;max-height:160px;overflow-y:auto;display:none;z-index:1;}
.nlog-fil-lead-list.open{display:block;}
.nlog-fil-lead-item{padding:7px 11px;color:var(--tx);font-size:12px;cursor:pointer;}
.nlog-fil-lead-item:hover{background:var(--sur2);color:var(--ac2);}
.nlog-fil-lead-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(79,124,255,.15);color:var(--ac2);padding:4px 10px;border-radius:999px;font-size:11.5px;margin-top:6px;}
.nlog-fil-lead-x{cursor:pointer;}
.nlog-fil-foot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:0.5px solid var(--brd);margin-top:12px;}
.nlog-fil-clr{background:none;border:none;color:var(--mu);cursor:pointer;font-size:12px;font-family:var(--font);}
.nlog-fil-clr:hover{color:var(--ac2);}
.nlog-fil-done{background:var(--ac);border:none;color:#fff;cursor:pointer;font-size:12px;font-family:var(--font);font-weight:500;padding:6px 14px;border-radius:7px;}
.nlog-fil-done:hover{background:var(--ac2);}
@media(max-width:640px){
  .nlog-search{width:100%;}
  .nlog-toolbar{width:100%;}
}
.nlog-title{font-size:22px;font-weight:600;color:var(--tx);letter-spacing:-.3px;}
.nlog-sub{font-size:12.5px;color:var(--mu);margin-top:3px;}
.nlog-layout{display:flex;gap:20px;align-items:stretch;flex:1;min-height:0;overflow:hidden;padding:0 32px;}
.nlog-cats{width:220px;flex:none;display:flex;flex-direction:column;gap:2px;padding-right:16px;padding-top:16px;border-right:0.5px solid var(--brd);max-height:100%;overflow-y:auto;}
.nlog-cat{display:flex;align-items:center;gap:11px;padding:9px 12px;border:none;background:transparent;color:var(--mu);border-radius:8px;cursor:pointer;font-family:var(--font);font-size:13px;text-align:left;width:100%;transition:background .12s,color .12s;}
.nlog-cat:hover{background:rgba(255,255,255,.04);color:var(--tx);}
.nlog-cat.active{background:var(--ac);color:#fff;}
.nlog-cat.active:hover{background:var(--ac);color:#fff;}
.nlog-cat-ic{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;}
.nlog-cat-ic svg{width:16px;height:16px;}
.nlog-cat-lbl{flex:1;}
.nlog-cat-count{background:var(--sur);color:var(--mu);border-radius:999px;min-width:22px;padding:0 7px;line-height:18px;font-size:11px;text-align:center;font-weight:600;}
.nlog-cat.active .nlog-cat-count{background:rgba(255,255,255,.22);color:#fff;}
.nlog-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding-top:16px;}
.nlog-feed{display:flex;flex-direction:column;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:12px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--brd2) transparent;}
.nlog-feed::-webkit-scrollbar{width:8px;}
.nlog-feed::-webkit-scrollbar-track{background:transparent;}
.nlog-feed::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px;}
@media(max-width:640px){
  .nlog-head{padding:8px 14px;}
  .nlog-period{display:none;}
  button.nlog-period-mobile{display:flex;}
}
@media(max-width:900px){
  .nlog-page{height:auto;overflow:visible;padding-bottom:60px;}
  .nlog-layout{flex-direction:column;overflow:visible;padding:14px 16px 0;}
  .nlog-cats{width:100%;flex-direction:row;overflow-x:auto;overflow-y:visible;max-height:none;border-right:none;border-bottom:0.5px solid var(--brd);padding-right:0;padding-bottom:12px;gap:6px;}
  .nlog-cat{flex:none;width:auto;padding:7px 12px;}
  .nlog-cat-lbl{flex:none;}
  .nlog-cat-count{margin-left:4px;}
  .nlog-main{overflow:visible;padding-bottom:0;}
  .nlog-feed{flex:none;overflow:visible;}
}
.nlog-row{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;width:100%;background:transparent;border:none;border-bottom:0.5px solid var(--brd);cursor:pointer;text-align:left;font-family:var(--font);transition:background .12s;}
.nlog-row:last-child{border-bottom:none;}
.nlog-row:hover{background:rgba(255,255,255,.04);}
.nlog-ic{width:34px;height:34px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;}
.nlog-ic svg{width:16px;height:16px;}
.nlog-av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;letter-spacing:.3px;margin-top:2px;}
.nlog-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.nlog-line{font-size:13px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nlog-line strong{font-weight:600;}
.nlog-body-txt{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nlog-meta{display:flex;align-items:center;gap:10px;margin-top:3px;}
.nlog-time{font-size:11px;color:var(--mu);}
.nlog-pill{font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px;}
.nlog-pill.sent{background:rgba(110,157,255,.16);color:#6e9dff;}
.nlog-pill.replied{background:rgba(45,212,191,.16);color:#2dd4bf;}
.nlog-pill.missed{background:rgba(232,85,85,.16);color:#e85555;}
.nlog-pill.returned{background:rgba(34,200,138,.16);color:#22c88a;}
.nlog-pill.inbound{background:rgba(110,157,255,.16);color:#6e9dff;}
.nlog-pill.created{background:rgba(245,166,35,.16);color:#f5a623;}
.nlog-pill.canceled{background:rgba(232,85,85,.16);color:#e85555;}
.nlog-pill.completed{background:rgba(34,200,138,.16);color:#22c88a;}
.nlog-empty{padding:80px 24px;text-align:center;color:var(--mu);}
.nlog-empty-ic{font-size:36px;margin-bottom:10px;opacity:.5;}

/* Leads-style FILTER DROPDOWN + chips (ported verbatim from coreconnect_leads_v83) */
.filter-chips{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:visible;min-width:0;flex-shrink:1;}
.filter-chips:empty{display:none;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 9px;height:32px;border-radius:8px;font-size:12.5px;font-weight:500;background:var(--sur2);border:0.5px solid var(--brd2);color:var(--ac2);cursor:default;white-space:nowrap;flex-shrink:0;position:relative;}
.chip-label{color:var(--mu);font-weight:400;margin-right:1px;}
.chip:hover{border-color:var(--ac);}
.chip-x-corner{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--rd);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:10;border:1.5px solid var(--bg);font-size:10px;}
.chip:hover .chip-x-corner{display:flex;}

.fd-wrap{position:fixed;top:0;left:0;z-index:9400;display:none;background:var(--sur);border:0.5px solid var(--brd2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;max-height:calc(100vh - 32px);}
.fd-wrap.open{display:flex;}
.fd-mobile-header{display:none;align-items:center;gap:6px;padding:10px 12px;border-bottom:0.5px solid var(--brd2);background:var(--sur);flex-shrink:0;}
.fd-mobile-back{width:40px;height:40px;border-radius:8px;background:transparent;border:none;color:var(--tx);cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;display:none;}
.fd-mobile-back:hover{background:rgba(255,255,255,.05);}
.fd-mobile-header.show-back .fd-mobile-back{display:flex;}
.fd-mobile-title{flex:1;font-size:15px;font-weight:600;color:var(--tx);text-align:center;padding:0 6px;}
.fd-mobile-close{width:40px;height:40px;border-radius:8px;background:transparent;border:none;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fd-mobile-close:hover{background:rgba(255,255,255,.05);color:var(--tx);}
.fd-left{width:200px;display:flex;flex-direction:column;border-right:0.5px solid var(--brd2);background:var(--sur);}
.fd-list{flex:1;padding:6px;overflow-y:auto;min-height:0;}
.fd-cat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background .12s,color .12s;color:var(--tx);font-size:12.5px;}
.fd-cat:hover{background:var(--sur2);color:var(--ac2);}
.fd-cat.active{background:rgba(79,124,255,.10);color:var(--ac2);}
.fd-cat-label{flex:1;}
.fd-cat-count{font-family:var(--mono);font-size:11px;color:var(--ac2);background:rgba(79,124,255,.12);padding:1px 6px;border-radius:4px;min-width:18px;text-align:center;}
.fd-cat-chev{color:var(--mu);display:flex;align-items:center;font-size:13px;}
.fd-cat:hover .fd-cat-chev,.fd-cat.active .fd-cat-chev{color:var(--ac2);}
.fd-foot{padding:8px 12px;border-top:0.5px solid var(--brd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.fd-clear{font-size:11.5px;color:var(--mu);cursor:pointer;}
.fd-clear:hover{color:var(--rd);}
.fd-foot-hint{font-size:10.5px;color:var(--mu);font-family:var(--mono);}
.fd-right{width:280px;display:none;flex-direction:column;background:var(--sur2);}
.fd-right.show{display:flex;}
.fd-search{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
.fd-search input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-family:var(--font);font-size:12.5px;}
.fd-search input::placeholder{color:var(--mu);}
.fd-opts{flex:1;overflow-y:auto;padding:6px;min-height:0;}
.fd-opt{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;cursor:pointer;}
.fd-opt:hover{background:rgba(255,255,255,.04);}
.fd-opt.chosen{background:rgba(79,124,255,.08);}
.fd-opt-label{font-size:12.5px;color:var(--tx);flex:1;}
.fd-opt.chosen .fd-opt-label{color:var(--ac2);}
.fd-empty{padding:18px 14px;text-align:center;font-size:12px;color:var(--mu);}
.fp-cb{width:13px;height:13px;border-radius:3px;border:0.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fp-cb.on{background:var(--ac);border-color:var(--ac);}
.fp-cb.on::after{content:'';width:5px;height:3.5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);}
.fp-radio{width:13px;height:13px;border-radius:50%;border:0.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fp-radio.on{border-color:var(--ac);}
.fp-radio.on::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--ac);}

@media(max-width:640px){
  .fd-wrap.open{width:calc(100vw - 16px);height:auto;max-height:calc(100vh - 80px);}
  .fd-mobile-header{display:flex;}
  .fd-left{width:100%;}
  .fd-right{position:absolute;top:60px;left:100%;width:100%;height:calc(100% - 60px);transition:left .2s;}
  .fd-wrap.fd-show-opts .fd-left{display:none;}
  .fd-wrap.fd-show-opts .fd-right{display:flex;left:0;}
}
</style>
</head>

        <span class="nlog-cat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        <span class="nlog-cat-lbl">Activities</span>

      </div>

  <!-- Mobile period drawer -->
  <div class="nlog-pd-backdrop" id="nlog-pd-backdrop" onclick="closeLogPeriodDrawer()"></div>
  <div class="nlog-pd-drawer" id="nlog-pd-drawer">

      <span class="nlog-pd-title">Period</span>
      <button class="nlog-pd-close" onclick="closeLogPeriodDrawer()" aria-label="Close">&times;</button>

      <button class="nlog-pd-item" data-period="today" onclick="setLogPeriod('today');closeLogPeriodDrawer();">Today</button>
      <button class="nlog-pd-item" data-period="thisWeek" onclick="setLogPeriod('thisWeek');closeLogPeriodDrawer();">This Week</button>
      <button class="nlog-pd-item" data-period="thisMonth" onclick="setLogPeriod('thisMonth');closeLogPeriodDrawer();">This Month</button>
      <button class="nlog-pd-item" data-period="all" onclick="setLogPeriod('all');closeLogPeriodDrawer();">All Time</button>
    </div>
  </div>
</div>

<script src="../shared/leads-comms.js"></script>
<script>
/* ============ CHROME ============ */
function navClick(name){
  if(name==='Home'){ window.location.href = '../coreconnect_dashboard_v41/coreconnect_dashboard_v41.html'; return; }
  if(name==='CRM'){ window.location.href = '../coreconnect_leads_v83/coreconnect_leads_v83.html'; return; }
  if(name==='Call'){ window.location.href = '../call_history/coreconnect_call_history_v31.html'; return; }
  if(name==='Message'){ window.location.href = '../coreconnect_message_history_v41/coreconnect_message_history_v41.html'; return; }
  if(name==='Voice mail'){ window.location.href = '../coreconnect_voicemail_history_v9/coreconnect_voicemail_history_v9.html'; return; }
  if(name==='Appointments'){ window.location.href = '../coreconnect_appointments/coreconnect_appointments.html'; return; }
  if(name==='Settings'){ window.location.href = '../Settings/Settings_main_page/coreconnect_settings.html'; return; }
}
function toggleMobileDrawer(){var d=document.getElementById('mobile-drawer'),b=document.getElementById('mobile-drawer-backdrop');if(!d)return;var o=d.classList.contains('open');d.classList.toggle('open',!o);if(b)b.classList.toggle('open',!o);document.body.style.overflow=o?'':'hidden';}
function closeMobileDrawer(){var d=document.getElementById('mobile-drawer'),b=document.getElementById('mobile-drawer-backdrop');if(d)d.classList.remove('open');if(b)b.classList.remove('open');document.body.style.overflow='';}

/* Notifications dropdown (notifications.js overrides openNotifications, setNotifTab, markAllNotificationsRead) */
function toggleNotifications(e){if(e)e.stopPropagation();var p=document.getElementById('notif-panel');if(!p)return;if(p.classList.contains('open'))closeNotifications();else openNotifications();}
function openNotifications(){var p=document.getElementById('notif-panel'),b=document.getElementById('header-bell');if(!p||!b)return;if(p.parentElement!==document.body)document.body.appendChild(p);positionNotifications();p.classList.add('open');b.classList.add('active');}
function closeNotifications(){var p=document.getElementById('notif-panel'),b=document.getElementById('header-bell');if(p)p.classList.remove('open');if(b)b.classList.remove('active');}
function positionNotifications(){var p=document.getElementById('notif-panel'),b=document.getElementById('header-bell');if(!p||!b)return;var r=b.getBoundingClientRect();var w=p.offsetWidth||420;p.style.top=(r.bottom+8)+'px';p.style.left=Math.max(8,r.right-w)+'px';}
function setNotifTab(t){document.querySelectorAll('.notif-tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===t);});}
function markAllNotificationsRead(){}
document.addEventListener('click',function(e){var p=document.getElementById('notif-panel'),b=document.getElementById('header-bell');if(p&&p.classList.contains('open')&&!(b&&b.contains(e.target))&&!p.contains(e.target))closeNotifications();});
window.addEventListener('resize',function(){var p=document.getElementById('notif-panel');if(p&&p.classList.contains('open'))positionNotifications();});

/* ============ NOTIFICATIONS LOG PAGE ============ */
var _logType = 'all';
var _logEntries = [];
var _period = 'today';
var _specificDate = null; // 'yyyy-mm-dd' when calendar picks a day
var _filterStatuses = new Set();
var _filterLead = null;
var _filterDirections = new Set();
var _search = '';

var ICONS = {
  sms:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>',
  call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  appt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  reminder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  task: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>'
};
var ICON_BG = { sms:'rgba(45,212,191,.14)', email:'rgba(110,157,255,.14)', call:'rgba(232,85,85,.14)', activity:'rgba(245,166,35,.14)' };
var ICON_FG = { sms:'#2dd4bf', email:'#6e9dff', call:'#e85555', activity:'#f5a623' };

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initialsOf(n){var p=String(n||'').trim().split(/\s+/);return (((p[0]||'')[0]||'')+((p.length>1&&p[p.length-1][0])||'')).toUpperCase();}
function colorFor(n){var P=['#534AB7','#0F6E56','#B73D5B','#3D81B7','#B77B3D','#22c88a','#e85555','#f5a623','#6e9dff','#2dd4bf'];var h=0,x=String(n||'');for(var i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))>>>0;return P[h%P.length];}
function relTime(ts){var d=(Date.now()-ts)/1000;if(d<45)return 'Just now';if(d<3600)return Math.round(d/60)+'m ago';if(d<86400)return Math.round(d/3600)+'h ago';var dt=new Date(ts),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return M[dt.getMonth()]+' '+dt.getDate();}

/* Deterministic per-lead PRNG */
function srand(seed){ var s = seed|0; return function(){ s = (s*1664525 + 1013904223) >>> 0; return (s & 0xfffffff) / 0xfffffff; }; }

function leadDescriptor(L){
  return { no:L.no, name:L.name||'Unknown', av:initialsOf(L.name||'??'), color:L.ac||colorFor(L.name) };
}

function buildLogEntries(){
  var out = [];
  var leads = (window.CCLeads && CCLeads.LEADS) ? CCLeads.LEADS : [];
  var NOW = Date.now();
  var HOUR = 3600*1000;

  /* --- Calls (sourced from CCLeads.callCountsForLead) --- */
  var SMS_OUT_LINES = ['Just wanted to check in — let me know if you have questions.','Following up on the test drive — interested in moving forward?','Sent you the pricing breakdown. Have a look when you can.','Quick reminder about your appointment tomorrow.','Got a new arrival you might like.'];
  var SMS_IN_LINES = ['Thanks, will check in tonight.','Can we move it to 3pm?','Got the docs, thank you!','Is the vehicle still available?','Sounds good — see you then.'];
  var EMAIL_OUT_SUBJ = ['Your financing options','Following up on your visit','Loan paperwork attached','Re: Trade-in appraisal','Vehicle quote — as discussed'];
  var EMAIL_IN_SUBJ = ['Re: Financing options','Re: Following up on your visit','Re: Loan paperwork','Re: Trade-in appraisal','Re: Question about my appointment'];
  var APPT_TYPES = ['Test drive','Delivery','Trade-in appraisal','Walk-around','Financing discussion'];

  leads.forEach(function(L, i){
    if(!L || L.no==null) return;
    var ld = leadDescriptor(L);
    var rnd = srand(L.no * 7919 + 13);

    /* CALLS */
    if(window.CCLeads && CCLeads.callCountsForLead){
      var cc = CCLeads.callCountsForLead(L);
      var baseT = NOW - Math.floor(rnd()*48*HOUR) - HOUR;
      for(var m=0; m<cc.missed; m++){
        out.push({ id:'call_m_'+L.no+'_'+m, type:'call', subType:'call-missed', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'Missed call', body:'Inbound, not answered', ts: baseT - m*3*HOUR - Math.floor(rnd()*HOUR), status:'Missed' });
      }
      for(var r=0; r<cc.returned; r++){
        out.push({ id:'call_r_'+L.no+'_'+r, type:'call', subType:'call-returned', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'Returned call', body:'Outbound · '+(60+Math.floor(rnd()*240))+'s', ts: baseT - (cc.missed+r)*3*HOUR - Math.floor(rnd()*HOUR), status:'Returned' });
      }
    }

    /* SMS */
    if(L.phone){
      var smsOut = 1 + Math.floor(rnd()*3);
      var smsBaseT = NOW - Math.floor(rnd()*36*HOUR) - 30*60*1000;
      for(var s=0; s<smsOut; s++){
        out.push({ id:'sms_s_'+L.no+'_'+s, type:'sms', subType:'sms-sent', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'Sent SMS', body: SMS_OUT_LINES[Math.floor(rnd()*SMS_OUT_LINES.length)], ts: smsBaseT - s*4*HOUR - Math.floor(rnd()*HOUR), status:'Sent' });
        if(rnd() < 0.6){
          out.push({ id:'sms_r_'+L.no+'_'+s, type:'sms', subType:'sms-replied', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'New SMS reply', body: SMS_IN_LINES[Math.floor(rnd()*SMS_IN_LINES.length)], ts: smsBaseT - s*4*HOUR + 25*60*1000, status:'Replied' });
        }
      }
    }

    /* EMAIL */
    if(L.email){
      var emOut = Math.floor(rnd()*2) + 1;
      var emBaseT = NOW - Math.floor(rnd()*40*HOUR) - 2*HOUR;
      for(var e=0; e<emOut; e++){
        out.push({ id:'em_s_'+L.no+'_'+e, type:'email', subType:'email-sent', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'Sent email', body: EMAIL_OUT_SUBJ[Math.floor(rnd()*EMAIL_OUT_SUBJ.length)], ts: emBaseT - e*6*HOUR, status:'Sent' });
        if(rnd() < 0.45){
          out.push({ id:'em_r_'+L.no+'_'+e, type:'email', subType:'email-replied', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'New email reply', body: EMAIL_IN_SUBJ[Math.floor(rnd()*EMAIL_IN_SUBJ.length)], ts: emBaseT - e*6*HOUR + 90*60*1000, status:'Replied' });
        }
      }
    }

    /* ACTIVITIES — synthesize 1 deterministic appt + occasional reminder/task per lead */
    var hasAppt = rnd() < 0.55;
    if(hasAppt){
      var apptType = APPT_TYPES[Math.floor(rnd()*APPT_TYPES.length)];
      var apptCreatedT = NOW - Math.floor(rnd()*72*HOUR);
      var apptDateT = NOW + (rnd()<0.5 ? -24*HOUR*(1+Math.floor(rnd()*5)) : 24*HOUR*Math.floor(rnd()*7));
      var apptDateStr = new Date(apptDateT).toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + new Date(apptDateT).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      out.push({ id:'act_appt_c_'+L.no, type:'activity', subType:'appt-created', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'Appointment created', body: apptType+' — '+apptDateStr, ts: apptCreatedT, status:'Created' });
      var deterministic = (L.no % 5 === 0);
      if(deterministic){
        out.push({ id:'act_appt_x_'+L.no, type:'activity', subType:'appt-canceled', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'Appointment canceled', body: apptType+' — '+apptDateStr, ts: apptCreatedT + 12*HOUR, status:'Canceled' });
      } else if(apptDateT < NOW){
        out.push({ id:'act_appt_d_'+L.no, type:'activity', subType:'appt-completed', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'Appointment completed', body: apptType+' — '+apptDateStr, ts: apptDateT + 30*60*1000, status:'Completed' });
      }
    }
    if(rnd() < 0.3){
      out.push({ id:'act_rem_'+L.no, type:'activity', subType:'reminder-created', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title:'Reminder created', body:'Follow up next week', ts: NOW - Math.floor(rnd()*36*HOUR), status:'Created' });
    }
    if(rnd() < 0.25){
      var taskDone = rnd() < 0.4;
      out.push({ id:'act_tsk_'+L.no, type:'activity', subType:'task-created', leadNo:L.no, leadName:ld.name, leadAv:ld.av, leadColor:ld.color, title: taskDone ? 'Task completed' : 'Task created', body:'Prep paperwork for visit', ts: NOW - Math.floor(rnd()*24*HOUR), status: taskDone ? 'Completed' : 'Created' });
    }
  });

  out.sort(function(a,b){ return b.ts - a.ts; });
  return out;
}

function rowIcon(entry){
  var sub = entry.subType||'';
  if(entry.type==='call') return ICONS.call;
  if(entry.type==='sms') return ICONS.sms;
  if(entry.type==='email') return ICONS.email;
  if(sub.indexOf('appt')===0) return ICONS.appt;
  if(sub.indexOf('reminder')===0) return ICONS.reminder;
  if(sub.indexOf('task')===0) return ICONS.task;
  return ICONS.appt;
}
function pillClass(status){return String(status||'').toLowerCase();}

function rowHtml(n){
  var bg = ICON_BG[n.type]||'rgba(255,255,255,.06)', fg = ICON_FG[n.type]||'#6e9dff';
  return '<button class="nlog-row" data-id="'+esc(n.id)+'" onclick="nlogClick(\''+esc(n.id)+'\')">'
    + '<span class="nlog-ic" style="background:'+bg+';color:'+fg+'">'+rowIcon(n)+'</span>'
    + '<span class="nlog-av" style="background:'+esc(n.leadColor||'#4f7cff')+'">'+esc(n.leadAv||'??')+'</span>'
    + '<span class="nlog-txt">'
      + '<span class="nlog-line"><strong>'+esc(n.title)+'</strong> · '+esc(n.leadName||'')+'</span>'
      + '<span class="nlog-body-txt">'+esc(n.body)+'</span>'
      + '<span class="nlog-meta"><span class="nlog-time">'+esc(relTime(n.ts))+'</span><span class="nlog-pill '+pillClass(n.status)+'">'+esc(n.status)+'</span></span>'
    + '</span>'
  + '</button>';
}

function renderLog(){
  var feed = document.getElementById('nlog-feed');
  var list = _logEntries;
  if(_logType !== 'all') list = list.filter(function(n){ return n.type === _logType; });
  list = list.filter(entryInPeriod);
  if(_filterStatuses.size) list = list.filter(function(n){ return _filterStatuses.has(n.status); });
  if(_filterLead) list = list.filter(function(n){ return n.leadNo === _filterLead.no; });
  if(_filterDirections.size){ list = list.filter(function(n){ var d = dirOf(n); return d && _filterDirections.has(d); }); }
  if(_search){ var q = _search; list = list.filter(function(n){ return (n.leadName+' '+n.title+' '+n.body).toLowerCase().includes(q); }); }
  if(!list.length){
    feed.innerHTML = '<div class="nlog-empty"><div class="nlog-empty-ic">🔔</div>No notifications for this filter.</div>';
  } else {
    feed.innerHTML = list.map(rowHtml).join('');
  }
  /* counts */
  var counts = { all:_logEntries.length, sms:0, email:0, call:0, activity:0 };
  _logEntries.forEach(function(n){ counts[n.type] = (counts[n.type]||0) + 1; });
  Object.keys(counts).forEach(function(k){
    var el = document.getElementById('nlog-count-'+k);
    if(el) el.textContent = counts[k];
  });
}

function setLogType(t){
  _logType = t;
  document.querySelectorAll('.nlog-cat').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-type') === t); });
  renderLog();
}

function nlogClick(id){
  var n = _logEntries.find(function(x){ return x.id === id; });
  if(!n) return;
  var depth = '../';
  if(n.type === 'call'){
    window.location.href = depth + 'call_history/coreconnect_call_history_v31.html?focus=' + encodeURIComponent(n.leadNo||'');
  } else if(n.type === 'sms' || n.type === 'email'){
    var tab = (n.type === 'sms') ? 'sms' : 'email';
    window.location.href = depth + 'coreconnect_leads_v83/coreconnect_leads_v83.html?openLead=' + encodeURIComponent(n.leadNo||'') + '&tab=' + tab;
  } else {
    window.location.href = depth + 'coreconnect_appointments/coreconnect_appointments.html';
  }
}

/* Period filter (Today / Week / Month / All) — synced with CCLeads */
var PERIOD_MS = { today: 24*3600*1000, thisWeek: 7*24*3600*1000, thisMonth: 30*24*3600*1000 };
function entryInPeriod(n){
  if(_specificDate){
    var d = new Date(n.ts);
    var dStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    return dStr === _specificDate;
  }
  if(_period === 'all') return true;
  return (Date.now() - n.ts) < (PERIOD_MS[_period] || 0);
}
function setLogPeriod(p){
  _period = p;
  _specificDate = null;
  if(window.CCLeads && CCLeads.setPeriod) CCLeads.setPeriod(p);
  renderPeriodActive();
  renderLog();
}
function renderPeriodActive(){
  document.querySelectorAll('.nlog-period-btn').forEach(function(b){
    b.classList.toggle('active', !_specificDate && b.getAttribute('data-period') === _period);
  });
  syncLogPeriodLabel();
}
var PERIOD_LABELS = { today:'Today', thisWeek:'Week', thisMonth:'Month', all:'All' };
function syncLogPeriodLabel(){
  var lbl = document.getElementById('nlog-period-mobile-lbl');
  if(lbl){
    if(_specificDate){
      var d = new Date(_specificDate+'T00:00:00');
      var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      lbl.textContent = M[d.getMonth()]+' '+d.getDate();
    } else {
      lbl.textContent = PERIOD_LABELS[_period] || 'All';
    }
  }
  document.querySelectorAll('.nlog-pd-item').forEach(function(b){
    b.classList.toggle('active', !_specificDate && b.getAttribute('data-period') === _period);
  });
}
function toggleLogPeriodDrawer(e){
  if(e) e.stopPropagation();
  var d = document.getElementById('nlog-pd-drawer'), b = document.getElementById('nlog-pd-backdrop');
  var isOpen = d.classList.contains('open');
  d.classList.toggle('open', !isOpen);
  b.classList.toggle('open', !isOpen);
}
function closeLogPeriodDrawer(){
  document.getElementById('nlog-pd-drawer').classList.remove('open');
  document.getElementById('nlog-pd-backdrop').classList.remove('open');
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeLogPeriodDrawer(); });

/* Calendar popover */
var _calView = new Date(); _calView.setDate(1);
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function toggleLogCal(e){
  if(e) e.stopPropagation();
  var pop = document.getElementById('nlog-cal-pop');
  if(pop.classList.contains('open')){ pop.classList.remove('open'); return; }
  positionLogCal();
  renderLogCal();
  pop.classList.add('open');
}
function positionLogCal(){
  var btn = document.getElementById('nlog-cal-btn');
  var pop = document.getElementById('nlog-cal-pop');
  var r = btn.getBoundingClientRect();
  pop.style.top = (r.bottom + 6) + 'px';
  pop.style.left = Math.max(8, r.right - 260) + 'px';
}
function logCalNav(delta){
  _calView.setMonth(_calView.getMonth() + delta);
  renderLogCal();
}
function renderLogCal(){
  document.getElementById('nlog-cal-title').textContent = MONTHS[_calView.getMonth()] + ' ' + _calView.getFullYear();
  var grid = document.getElementById('nlog-cal-grid');
  var html = '';
  ['S','M','T','W','T','F','S'].forEach(function(d){ html += '<div class="nlog-cal-wd">'+d+'</div>'; });
  var y = _calView.getFullYear(), m = _calView.getMonth();
  var firstDay = new Date(y, m, 1).getDay();
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var todayStr = new Date(); var todayKey = todayStr.getFullYear()+'-'+String(todayStr.getMonth()+1).padStart(2,'0')+'-'+String(todayStr.getDate()).padStart(2,'0');
  for(var i=0; i<firstDay; i++) html += '<button class="nlog-cal-day empty"></button>';
  for(var d=1; d<=daysInMonth; d++){
    var key = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls = 'nlog-cal-day';
    if(key === todayKey) cls += ' today';
    if(key === _specificDate) cls += ' selected';
    html += '<button class="'+cls+'" onclick="logCalPick(\''+key+'\')">'+d+'</button>';
  }
  grid.innerHTML = html;
}
function logCalPick(key){
  _specificDate = key;
  document.getElementById('nlog-cal-pop').classList.remove('open');
  document.getElementById('nlog-cal-btn').classList.add('active');
  renderPeriodActive();
  renderLog();
}
function logCalClear(){
  _specificDate = null;
  document.getElementById('nlog-cal-btn').classList.remove('active');
  document.getElementById('nlog-cal-pop').classList.remove('open');
  renderPeriodActive();
  renderLog();
}
document.addEventListener('click', function(e){
  var pop = document.getElementById('nlog-cal-pop'), btn = document.getElementById('nlog-cal-btn');
  if(pop && pop.classList.contains('open') && !pop.contains(e.target) && !(btn && btn.contains(e.target))) pop.classList.remove('open');
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ var p=document.getElementById('nlog-cal-pop'); if(p) p.classList.remove('open'); }});

/* Filter dropdown — leads-page two-pane pattern */
var filterConfig = [
  { key:'status', label:'Status', type:'multi', options:[
    {val:'Sent',label:'Sent'},{val:'Replied',label:'Replied'},{val:'Missed',label:'Missed'},
    {val:'Returned',label:'Returned'},{val:'Inbound',label:'Inbound'},
    {val:'Created',label:'Created'},{val:'Canceled',label:'Canceled'},{val:'Completed',label:'Completed'}
  ]},
  { key:'direction', label:'Direction', type:'multi', options:[
    {val:'inbound',label:'Inbound'},{val:'outbound',label:'Outbound'}
  ]},
  { key:'lead', label:'Lead', type:'single', options: [] }
];
var activeCatKey = null;

function refreshLeadOptions(){
  var leads = (window.CCLeads && CCLeads.LEADS) ? CCLeads.LEADS : [];
  filterConfig.find(function(c){ return c.key==='lead'; }).options = leads.map(function(l){ return { val:String(l.no), label:l.name }; });
}

function toggleFilterDropdown(e){
  if(e) e.stopPropagation();
  var dd = document.getElementById('filter-dropdown');
  if(dd.classList.contains('open')){ closeFilterDropdown(); return; }
  activeCatKey = null;
  refreshLeadOptions();
  renderFilterDropdown();
  positionFilterDropdown();
  dd.classList.add('open');
  setTimeout(positionFilterDropdown, 0);
  if(window.innerWidth > 640){
    var def = filterConfig.find(function(c){ return c.type==='multi' || c.type==='single'; });
    if(def) lockCategory(def.key);
  }
}
function positionFilterDropdown(){
  var dd = document.getElementById('filter-dropdown');
  var anchor = document.getElementById('nlog-filter-btn');
  if(!anchor) return;
  var r = anchor.getBoundingClientRect();
  var wasOpen = dd.classList.contains('open');
  if(!wasOpen){ dd.style.visibility = 'hidden'; dd.classList.add('open'); }
  var ddH = dd.offsetHeight || 440;
  if(!wasOpen){ dd.classList.remove('open'); dd.style.visibility = ''; }
  var top = r.bottom + 6;
  if(top + ddH > window.innerHeight - 8) top = Math.max(8, r.top - ddH - 6);
  dd.style.top = top + 'px';
  dd.style.left = Math.max(8, r.left) + 'px';
}
function closeFilterDropdown(){
  var dd = document.getElementById('filter-dropdown');
  dd.classList.remove('open');
  dd.classList.remove('fd-show-opts');
  var mt = document.getElementById('fd-mobile-title'); if(mt) mt.textContent = 'Filters';
  var mh = document.querySelector('.fd-mobile-header'); if(mh) mh.classList.remove('show-back');
}
function fdMobileBackToCategories(){
  var dd = document.getElementById('filter-dropdown');
  dd.classList.remove('fd-show-opts');
  document.getElementById('fd-mobile-title').textContent = 'Filters';
  document.querySelector('.fd-mobile-header').classList.remove('show-back');
  activeCatKey = null;
  renderFilterDropdown();
  document.getElementById('fd-right').classList.remove('show');
}
function getCatSelection(key){
  if(key === 'status') return _filterStatuses;
  if(key === 'direction') return _filterDirections;
  if(key === 'lead') return _filterLead ? new Set([String(_filterLead.no)]) : new Set();
  return new Set();
}
function getCatCount(key){
  if(key === 'status') return _filterStatuses.size;
  if(key === 'direction') return _filterDirections.size;
  if(key === 'lead') return _filterLead ? 1 : 0;
  return 0;
}
function renderFilterDropdown(){
  var list = document.getElementById('fd-list');
  list.innerHTML = '';
  filterConfig.forEach(function(cat){
    var row = document.createElement('div');
    row.className = 'fd-cat';
    if(cat.key === activeCatKey) row.classList.add('active');
    var cnt = getCatCount(cat.key);
    var badge = cnt > 0 ? '<span class="fd-cat-count">'+cnt+'</span>' : '';
    row.innerHTML = '<span class="fd-cat-label">'+esc(cat.label)+'</span>'+badge+'<span class="fd-cat-chev">›</span>';
    row.onclick = function(){ lockCategory(cat.key); };
    list.appendChild(row);
  });
}
function lockCategory(key){
  activeCatKey = key;
  renderFilterDropdown();
  var cat = filterConfig.find(function(c){ return c.key === key; });
  if(!cat) return;
  renderRightPane(cat);
}
function renderRightPane(cat){
  var right = document.getElementById('fd-right');
  var opts = document.getElementById('fd-opts');
  var searchInput = document.getElementById('fd-search-input');
  right.classList.add('show');
  var dd = document.getElementById('filter-dropdown');
  dd.classList.add('fd-show-opts');
  document.getElementById('fd-mobile-title').textContent = cat.label;
  document.querySelector('.fd-mobile-header').classList.add('show-back');
  searchInput.value = '';
  var sel = getCatSelection(cat.key);
  var isSingle = cat.type === 'single';
  opts.innerHTML = cat.options.map(function(opt){
    var on = sel.has(opt.val);
    var ind = isSingle ? '<div class="fp-radio'+(on?' on':'')+'"></div>' : '<div class="fp-cb'+(on?' on':'')+'"></div>';
    return '<div class="fd-opt'+(on?' chosen':'')+'" data-label="'+esc(opt.label.toLowerCase())+'" onclick="toggleFilterValue(\''+cat.key+'\',\''+opt.val.replace(/\'/g,"\\'")+'\')">'+ind+'<span class="fd-opt-label">'+esc(opt.label)+'</span></div>';
  }).join('') || '<div class="fd-empty">No options.</div>';
}
function filterRightPane(q){
  q = (q||'').toLowerCase().trim();
  document.querySelectorAll('#fd-opts .fd-opt').forEach(function(r){
    var lab = r.getAttribute('data-label') || '';
    r.style.display = (!q || lab.includes(q)) ? 'flex' : 'none';
  });
}
function toggleFilterValue(catKey, val){
  if(catKey === 'status'){
    if(_filterStatuses.has(val)) _filterStatuses.delete(val); else _filterStatuses.add(val);
  } else if(catKey === 'direction'){
    if(_filterDirections.has(val)) _filterDirections.delete(val); else _filterDirections.add(val);
  } else if(catKey === 'lead'){
    var no = parseInt(val,10);
    var lead = CCLeads.LEADS.find(function(l){ return l.no === no; });
    _filterLead = (_filterLead && _filterLead.no === no) ? null : (lead ? { no:lead.no, name:lead.name } : null);
  }
  var cat = filterConfig.find(function(c){ return c.key === catKey; });
  if(cat) renderRightPane(cat);
  renderFilterDropdown();
  updateFilterBadge();
  renderChips();
  renderLog();
}
function clearDropdownFilters(){
  _filterStatuses.clear(); _filterDirections.clear(); _filterLead = null;
  if(activeCatKey){ var c = filterConfig.find(function(x){ return x.key === activeCatKey; }); if(c) renderRightPane(c); }
  renderFilterDropdown();
  updateFilterBadge();
  renderChips();
  renderLog();
}
function renderChips(){
  var box = document.getElementById('chips-row'); if(!box) return;
  var chips = [];
  _filterStatuses.forEach(function(s){
    chips.push('<span class="chip"><span class="chip-label">Status:</span>'+esc(s)+'<span class="chip-x-corner" onclick="toggleFilterValue(\'status\',\''+s+'\')">&times;</span></span>');
  });
  _filterDirections.forEach(function(d){
    chips.push('<span class="chip"><span class="chip-label">Direction:</span>'+esc(d.charAt(0).toUpperCase()+d.slice(1))+'<span class="chip-x-corner" onclick="toggleFilterValue(\'direction\',\''+d+'\')">&times;</span></span>');
  });
  if(_filterLead){
    chips.push('<span class="chip"><span class="chip-label">Lead:</span>'+esc(_filterLead.name)+'<span class="chip-x-corner" onclick="toggleFilterValue(\'lead\',\''+_filterLead.no+'\')">&times;</span></span>');
  }
  box.innerHTML = chips.join('');
}
function updateFilterBadge(){
  var n = _filterStatuses.size + _filterDirections.size + (_filterLead ? 1 : 0);
  var badge = document.getElementById('nlog-filter-badge');
  if(n > 0){ badge.style.display = ''; badge.textContent = n; document.getElementById('nlog-filter-btn').classList.add('active'); }
  else { badge.style.display = 'none'; document.getElementById('nlog-filter-btn').classList.remove('active'); }
}
function dirOf(n){
  if(n.subType==='sms-sent' || n.subType==='email-sent' || n.subType==='call-returned') return 'outbound';
  if(n.subType==='sms-replied' || n.subType==='email-replied' || n.subType==='call-missed') return 'inbound';
  return null;
}
document.addEventListener('click', function(e){
  var dd = document.getElementById('filter-dropdown'), btn = document.getElementById('nlog-filter-btn');
  if(dd && dd.classList.contains('open') && !dd.contains(e.target) && !(btn && btn.contains(e.target))) closeFilterDropdown();
});
window.addEventListener('resize', function(){ var dd=document.getElementById('filter-dropdown'); if(dd && dd.classList.contains('open')) positionFilterDropdown(); });

/* Search */
var _searchT = null;
function nlogSearch(v){
  clearTimeout(_searchT);
  _searchT = setTimeout(function(){
    _search = (v||'').trim().toLowerCase();
    renderLog();
  }, 120);
}

function initNlog(){
  if(window.CCLeads && CCLeads.getPeriod) _period = CCLeads.getPeriod() || 'today';
  _logEntries = buildLogEntries();
  renderPeriodActive();
  renderLog();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNlog);
else initNlog();
</script>

<!-- Product switcher behavior -->
<script>
(function(){
  function portalSwitcher(){var ps=document.getElementById('product-switcher');if(ps && ps.parentElement!==document.body) document.body.appendChild(ps);}
  function positionSwitcher(){var logo=document.querySelector('.logo'),ps=document.getElementById('product-switcher');if(!logo||!ps)return;var r=logo.getBoundingClientRect();ps.style.left=((window.innerWidth>640)?66:r.left)+'px';ps.style.top=(r.bottom+8)+'px';}
  function toggleProductSwitcher(e){if(e)e.stopPropagation();var logo=document.querySelector('.logo'),ps=document.getElementById('product-switcher');if(!logo||!ps)return;portalSwitcher();var w=!ps.classList.contains('ps-open');if(w)positionSwitcher();ps.classList.toggle('ps-open',w);logo.classList.toggle('ps-open',w);}
  function closeProductSwitcher(){var logo=document.querySelector('.logo'),ps=document.getElementById('product-switcher');if(logo)logo.classList.remove('ps-open');if(ps)ps.classList.remove('ps-open');}
  window.toggleProductSwitcher=toggleProductSwitcher; window.closeProductSwitcher=closeProductSwitcher;
  function init(){ portalSwitcher(); document.querySelectorAll('.ps-item').forEach(function(a){ a.classList.toggle('ps-active', a.getAttribute('data-pid')==='coreconnect'); }); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
  document.addEventListener('mousedown', function(e){var ps=document.getElementById('product-switcher');if(!ps||!ps.classList.contains('ps-open'))return;if(e.target.closest && (e.target.closest('.logo')||e.target.closest('#product-switcher')))return;closeProductSwitcher();});
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeProductSwitcher(); });
  window.addEventListener('resize', function(){var ps=document.getElementById('product-switcher');if(ps && ps.classList.contains('ps-open')) positionSwitcher();});
  window.addEventListener('scroll', function(){var ps=document.getElementById('product-switcher');if(ps && ps.classList.contains('ps-open')) positionSwitcher();}, true);
})();
</script>
