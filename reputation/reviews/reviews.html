<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreConnect — Reputation · Reviews</title>
<link rel="stylesheet" href="../../shared/app.css">
<link rel="stylesheet" href="../../shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}

/* ── Top header (kept from app) ── */
.top-header{position:fixed;top:0;left:0;right:0;height:64px;background:var(--bg);border-bottom:0.5px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:60;}
.top-header .logo{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.3px;color:#fff;display:flex;align-items:center;gap:10px;}
.top-header .logo-mark{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.th-left{display:flex;align-items:center;gap:10px;}
.hamburger-btn{display:none;width:44px;height:44px;align-items:center;justify-content:center;border-radius:10px;background:transparent;border:none;color:var(--tx);cursor:pointer;flex-shrink:0;transition:background .12s;}
.hamburger-btn:hover{background:rgba(255,255,255,.05);}
.top-header-right{display:flex;align-items:center;gap:10px;}
.header-bell{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;color:var(--mu);transition:all .12s;background:transparent;border:none;}
.header-bell:hover{background:rgba(255,255,255,.05);color:var(--tx);}
.header-bell-dot{position:absolute;top:11px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--rd);border:2px solid var(--bg);}

/* ── Reputation sidebar ── */
.rep-sb{position:fixed;top:64px;left:0;width:232px;height:calc(100vh - 64px);background:var(--bg);border-right:0.5px solid var(--brd);display:flex;flex-direction:column;padding:14px 12px;gap:3px;z-index:55;overflow-y:auto;transition:transform .2s ease-out;}
.rep-nav{display:flex;flex-direction:column;gap:3px;}
.rep-item{position:relative;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:9px;color:var(--mu);cursor:pointer;font-size:13.5px;font-weight:500;transition:background .12s,color .12s;user-select:none;}
.rep-item:hover{background:rgba(255,255,255,.05);color:var(--tx);}
.rep-item.active{background:var(--ac);color:#fff;}
.rep-item.active:hover{background:var(--ac);color:#fff;}
.rep-item svg{width:18px;height:18px;flex:none;}
.rep-item .rep-lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-caret{width:14px;height:14px;color:var(--mu);flex:none;transition:transform .15s ease-out;}
.rep-item.active .rep-caret{color:#fff;}
.rep-item:hover .rep-caret{color:var(--tx);}
.rep-item-wrap{position:relative;}
.rep-submenu{display:none;position:fixed;min-width:200px;background:var(--sur);border:0.5px solid var(--brd2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:6px;z-index:9000;}
.rep-item-wrap.open .rep-submenu{display:flex;flex-direction:column;}
.rep-item-wrap.open .rep-caret{transform:rotate(90deg);}
.rep-submenu-item{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--tx);font-family:var(--font);font-size:13px;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer;transition:background .12s,color .12s;}
.rep-submenu-item:hover{background:rgba(255,255,255,.04);color:var(--ac2);}
.rep-submenu-mhead{display:none;}
@media (max-width:900px){
  .rep-submenu{position:fixed !important;inset:0 !important;width:auto !important;height:auto !important;min-width:0;border-radius:0;border:none;padding:0;transform:translateX(100%);visibility:hidden;transition:transform .25s ease-out,visibility 0s linear .25s;display:flex;flex-direction:column;z-index:220;background:var(--bg);}
  .rep-item-wrap.open .rep-submenu{transform:translateX(0);visibility:visible;transition:transform .25s ease-out,visibility 0s linear;}
  .rep-submenu-mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:0.5px solid var(--brd);flex:none;}
  .rep-submenu-back{width:44px;height:44px;border:none;background:var(--sur2);color:var(--tx);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .rep-submenu-back svg{width:20px;height:20px;}
  .rep-submenu-mtitle{font-size:15px;font-weight:600;color:var(--tx);}
  .rep-submenu-item{padding:16px 20px;min-height:52px;font-size:15px;border-radius:0;border-bottom:0.5px solid var(--brd);}
}

/* ── Content ── */
.rep-main{margin-left:232px;margin-top:64px;min-height:calc(100vh - 64px);background:var(--bg);color:var(--tx);display:flex;flex-direction:column;}
/* Icon-only sidebar (mirrors CoreConnect .sb-item style) */
.rep-sb{width:72px !important;padding:14px 0 !important;overflow:visible !important;z-index:90 !important;}
.rep-nav{align-items:center;}
.rep-item{gap:0 !important;padding:0 !important;width:44px !important;height:44px !important;justify-content:center;margin:0 auto;}
.rep-item .rep-lbl{display:none;}
.rep-item .rep-caret{display:none;}
.rep-item::after{content:attr(data-rep);position:absolute;left:58px;top:50%;transform:translateY(-50%);background:var(--sur2);color:var(--ac2);font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;border:0.5px solid var(--ac);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:100;}
.rep-item:hover::after{opacity:1;}
.rep-main{margin-left:72px !important;}
@media (max-width:900px){
  .rep-sb{width:100% !important;padding:12px !important;}
  .rep-nav{align-items:stretch;}
  .rep-item{width:auto !important;height:auto !important;min-height:44px !important;justify-content:flex-start;padding:0 12px !important;gap:12px !important;margin:0;}
  .rep-item .rep-lbl{display:block;}
  .rep-item .rep-caret{display:block;}
  .rep-item::after{display:none;}
  .rep-main{margin-left:0 !important;}
}
.rep-empty{margin:24px 20px;border:0.5px dashed var(--brd2);border-radius:14px;background:var(--sur);min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:40px;}
.rep-empty-icon{font-size:38px;opacity:.55;margin-bottom:6px;}
.rep-empty-title{font-size:15px;font-weight:600;color:var(--tx);}
.rep-empty-sub{font-size:13px;color:var(--mu);max-width:360px;}

/* Reviews 2-column display area */
.rev-grid{display:flex;gap:16px;padding:20px;align-items:flex-start;}
.rev-col-left{flex:0 0 20%;display:flex;flex-direction:column;gap:16px;min-width:0;}
.rev-col-right{flex:1;min-width:0;}
/* .rev-card migrated to shared `.card` */
.rev-card-title{font-size:14px;font-weight:600;color:var(--tx);text-align:center;margin-bottom:18px;}
.rev-avg-num{font-size:42px;font-weight:700;color:var(--tx);text-align:center;line-height:1;font-family:var(--font);}
.rev-avg-num .rev-avg-unit{font-size:24px;color:var(--mu);font-weight:500;margin-left:2px;}
.rev-stars{display:flex;justify-content:center;gap:4px;margin-top:10px;}
.rev-stars svg{width:22px;height:22px;}
.rev-avg-sub{font-size:12.5px;color:var(--mu);text-align:center;margin-top:10px;}
.rev-bar-wrap{margin-top:16px;padding-top:14px;border-top:0.5px solid var(--brd);}
.rev-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--brd);}
.rev-bar-neg{background:var(--rd);}
.rev-bar-pos{background:var(--gr);}
.rev-bar-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;}
.rev-bar-lab strong{font-weight:700;margin-right:4px;}
.rev-bar-lab-neg{color:var(--rd);}
.rev-bar-lab-pos{color:var(--gr);}
.rev-bar-lab-sub{color:var(--mu);font-weight:400;}
.rev-count-num{font-size:42px;font-weight:700;color:var(--tx);text-align:center;line-height:1;}
.rev-count-sub{font-size:13px;color:var(--mu);text-align:center;margin-top:10px;}
.rev-count-sub strong{color:var(--ac2);font-weight:700;}
/* .rev-empty (dead CSS — no markup references it) — use shared `.empty-state` instead */
@media (max-width:900px){
  .rev-grid{flex-direction:column;padding:16px;}
  .rev-col-left,.rev-col-right{flex:1 1 auto;width:100%;}
}

/* Right column block #1 — chart card with tabs */
.rev-r1{padding:14px;}
.rev-r1-tabs{display:flex;justify-content:center;gap:4px;background:var(--sur2);border:0.5px solid var(--brd);border-radius:8px;padding:4px;margin:0 auto 14px;width:fit-content;}
.rev-r1-tab{background:transparent;border:none;color:var(--mu);font-family:var(--font);font-size:12.5px;padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s;}
.rev-r1-tab:hover{color:var(--tx);}
.rev-r1-tab.active{background:var(--sur);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.3);}
.rev-r1-select{display:none;}
.rev-r1-body{min-height:360px;}
.rev-r1-svg{width:100%;height:auto;display:block;overflow:visible;}
.rev-r1-svg .rc-grid{stroke:var(--brd);stroke-width:0.5;}
.rev-r1-svg .rc-axis{fill:var(--mu);font-size:11px;font-family:var(--font);}
.rev-r1-svg .rc-ytitle{fill:var(--mu);font-size:11px;font-family:var(--font);}
.rev-r1-svg .rc-ytitle-right{fill:var(--ac2);font-size:11px;font-family:var(--font);}
.rev-r1-svg .rc-total{fill:var(--mu);font-size:11px;font-family:var(--font);text-anchor:middle;}
.rev-r1-svg .rc-stk-pos{fill:var(--gr);}
.rev-r1-svg .rc-stk-neu{fill:var(--am);}
.rev-r1-svg .rc-stk-neg{fill:var(--rd);}
.rev-r1-svg .rc-stk-resp{fill:#0f6e56;}
.rev-r1-svg .rc-stk-unresp{fill:var(--mu);}
.rev-r1-svg .rc-stk-notresp{fill:var(--teal);}
.rev-r1-svg .rc-line{fill:none;stroke:var(--ac2);stroke-width:2;}
.rev-r1-svg .rc-dot{fill:var(--ac2);}
.rev-r1-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:8px;font-size:12px;color:var(--mu);}
.rev-r1-leg{display:inline-flex;align-items:center;gap:6px;}
.rev-r1-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;}
.rev-r1-leg.line i{height:2px;border-radius:0;background:var(--ac2);}

/* Right column block #2 — 5-cell stat strip */
.rev-r2{display:flex;padding:18px 4px;margin-top:16px;}
.rev-r2-cell{flex:1;min-width:0;padding:0 18px;border-left:0.5px solid var(--brd);}
.rev-r2-cell:first-child{border-left:none;}
.rev-r2-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ac2);font-weight:500;}
.rev-r2-info{width:13px;height:13px;color:var(--mu);flex:none;cursor:help;}
.rev-r2-pct{color:var(--mu);font-size:12px;font-weight:400;}
.rev-r2-val{font-size:28px;font-weight:700;color:var(--tx);line-height:1.1;margin-top:10px;}
.rev-r2-tipwrap{position:relative;display:inline-flex;align-items:center;cursor:help;outline:none;}
.rev-r2-tipwrap::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--sur2);color:var(--tx);font-family:var(--font);font-size:11.5px;font-weight:400;line-height:1.3;padding:6px 9px;border-radius:6px;border:0.5px solid var(--brd2);box-shadow:0 6px 16px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s,visibility .12s;z-index:50;}
.rev-r2-tipwrap::before{content:'';position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--brd2);pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s,visibility .12s;z-index:50;}
.rev-r2-head:hover .rev-r2-tipwrap::after,.rev-r2-head:hover .rev-r2-tipwrap::before,.rev-r2-tipwrap:focus::after,.rev-r2-tipwrap:focus::before{opacity:1;visibility:visible;}
.rev-r2-cell:last-child .rev-r2-tipwrap::after{left:auto;right:0;transform:none;}
.rev-r2-cell:last-child .rev-r2-tipwrap::before{left:auto;right:8px;transform:none;}

/* Right column block #3 — review list (Step 1: header + 1 card) */
.rev-r3{margin-top:16px;display:flex;flex-direction:column;gap:12px;}
.rev-r3-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;flex-wrap:wrap;}
.rev-r3-count{color:var(--mu);font-size:13px;}
.rev-r3-count strong{color:var(--tx);font-weight:700;}
.rev-r3-actions{display:flex;gap:8px;flex-wrap:wrap;}
.rev-r3-btn{background:var(--sur2);border:0.5px solid var(--brd2);border-radius:8px;height:36px;padding:0 12px;color:var(--tx);font-family:var(--font);font-size:12.5px;cursor:default;display:flex;align-items:center;gap:6px;}
.rev-r3-chev{width:12px;height:12px;color:var(--mu);transition:transform .15s ease-out;flex:none;}
.rev-r3-dl-wrap.open .rev-r3-chev{transform:rotate(180deg);}
.rev-r3-dl-wrap{position:relative;}
.rev-r3-dl-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;min-width:180px;background:var(--sur);border:0.5px solid var(--brd2);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.45);overflow:hidden;z-index:60;}
.rev-r3-dl-menu.open{display:flex;flex-direction:column;}
.rev-r3-dl-item{display:flex;align-items:center;background:none;border:none;color:var(--tx);font-family:var(--font);font-size:13px;text-align:left;padding:10px 14px;cursor:pointer;transition:background .12s,color .12s;}
.rev-r3-dl-item:hover{background:rgba(255,255,255,.04);color:var(--ac2);}
.rev-r3-list{display:flex;flex-direction:column;gap:12px;}
.rev-card-item{display:flex;gap:20px;background:var(--sur);border:0.5px solid var(--brd2);border-radius:14px;padding:18px 20px;}
.ri-left{flex:0 0 200px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.ri-src-logo{width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative;}
.ri-biz{font-size:14px;font-weight:600;color:var(--tx);line-height:1.3;}
.ri-reviewer{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx);font-weight:500;}
.ri-rev-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex:none;}
.ri-date{font-size:12px;color:var(--mu);}
.ri-status{display:inline-flex;align-items:center;gap:6px;background:rgba(34,200,138,.15);color:var(--gr);padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500;align-self:flex-start;}
.ri-status svg{width:13px;height:13px;}
.ri-status.is-flagged{background:rgba(232,85,85,.15);color:var(--rd);}
.ri-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
.ri-rating-row{display:flex;align-items:center;gap:8px;}
.ri-rating-row .rev-stars{margin-top:0;gap:2px;}
.ri-rating-row .rev-stars svg{width:18px;height:18px;}
.ri-rating-val{font-size:13px;color:var(--tx);font-weight:500;}
.ri-kebab{margin-left:auto;background:none;border:none;color:var(--mu);width:32px;height:32px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;}
.ri-kebab:hover{color:var(--tx);background:var(--sur2);}
.ri-kebab-wrap{position:relative;margin-left:auto;}
.ri-kebab-wrap .ri-kebab{margin-left:0;}
.ri-kebab-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;min-width:160px;background:var(--sur);border:0.5px solid var(--brd2);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.45);overflow:hidden;z-index:60;}
.ri-kebab-menu.open{display:flex;flex-direction:column;}
.ri-kebab-item{display:flex;align-items:center;background:none;border:none;color:var(--tx);font-family:var(--font);font-size:13px;text-align:left;padding:10px 14px;cursor:pointer;transition:background .12s,color .12s;}
.ri-kebab-item:hover{background:rgba(255,255,255,.04);color:var(--ac2);}
.ri-tmpl-wrap{position:relative;display:inline-flex;}
.ri-tmpl-menu{display:none;position:fixed;min-width:280px;max-width:min(360px, calc(100vw - 32px));max-height:320px;overflow-y:auto;background:var(--sur);border:0.5px solid var(--brd2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:9500;padding:4px;}
.ri-tmpl-menu.open{display:flex;flex-direction:column;}
.ri-tmpl-item{display:flex;flex-direction:column;gap:4px;background:none;border:none;color:var(--tx);font-family:var(--font);font-size:13px;text-align:left;padding:10px 12px;cursor:pointer;border-radius:6px;transition:background .12s;}
.ri-tmpl-item:hover{background:rgba(255,255,255,.05);}
.ri-tmpl-name{font-weight:600;color:var(--tx);font-size:13px;}
.ri-tmpl-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mu);}
.ri-tmpl-dot{display:inline-block;width:8px;height:8px;border-radius:50%;}
.ri-tmpl-preview{font-size:12px;color:var(--mu);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ri-tmpl-empty{padding:14px 12px;font-size:12.5px;color:var(--mu);text-align:center;line-height:1.5;}
@media (max-width:640px){
  .ri-tmpl-item{min-height:52px;}
  .ri-tmpl-menu{min-width:240px;}
}
.ri-text{font-size:13px;color:var(--tx);line-height:1.5;}
.ri-attrs{display:flex;flex-wrap:wrap;gap:8px;}
.ri-attr-chip{background:var(--sur2);color:var(--tx);font-size:12px;padding:5px 10px;border-radius:6px;border:0.5px solid var(--brd);}
.ri-attr-add{background:none;border:0.5px solid var(--ac2);color:var(--ac2);font-family:var(--font);font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;}
.ri-reply{margin-top:6px;border:0.5px solid var(--brd2);border-radius:8px;background:var(--sur2);overflow:hidden;}
.ri-reply-top{display:flex;align-items:flex-start;padding:12px;gap:10px;font-size:13px;color:var(--mu);}
.ri-reply-input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-family:var(--font);font-size:13px;line-height:1.45;padding:0;resize:vertical;min-height:36px;max-height:180px;}
.ri-reply-input::placeholder{color:var(--mu);}
.ri-reply-responded{padding:14px;font-size:12.5px;color:var(--mu);display:flex;align-items:center;gap:8px;}
.ri-reply-responded strong{color:var(--gr);font-weight:600;}
.ri-reply-responded-icon{color:var(--gr);width:16px;height:16px;flex:none;}
.ri-reply-saved{padding:14px;}
.ri-reply-saved-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;flex-wrap:wrap;}
.ri-reply-saved-label{padding:3px 8px;border-radius:4px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
.ri-reply-saved-label.is-user{background:rgba(34,200,138,.18);color:var(--gr);}
.ri-reply-saved-label.is-ai{background:linear-gradient(135deg, rgba(79,124,255,.22), rgba(196,181,253,.22));color:var(--ac2);border:0.5px solid rgba(79,124,255,.4);display:inline-flex;align-items:center;gap:5px;}
.ri-reply-saved-sparkle{width:11px;height:11px;flex:none;}
.ri-reply-saved-time{color:var(--mu);}
.ri-reply-saved-edit{margin-left:auto;background:none;border:none;color:var(--ac2);font-family:var(--font);font-size:12px;cursor:pointer;padding:4px 8px;border-radius:6px;}
.ri-reply-saved-edit:hover{background:rgba(79,124,255,.08);}
.ri-reply-saved-text{font-size:13px;color:var(--tx);line-height:1.5;background:var(--sur);border-left:2px solid var(--ac2);padding:10px 12px;border-radius:0 6px 6px 0;}
.ri-reply-thumbs{margin-left:auto;width:28px;height:28px;color:var(--mu);background:rgba(255,255,255,.04);border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none;}
.ri-reply-bottom{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:0.5px solid var(--brd);background:var(--sur);}
.ri-reply-icon{width:32px;height:32px;border-radius:6px;color:var(--mu);background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ri-reply-icon:hover{color:var(--tx);background:var(--sur2);}
.ri-reply-icon svg{width:16px;height:16px;}
.ri-reply-sp{flex:1;}
.ri-reply-analyze{font-size:12px;color:var(--mu);padding:0 8px;}

.rep-chev{transition:transform .15s;}
.rep-dd{position:relative;}
.rep-dd.open .rep-tbtn{border-color:var(--ac);color:var(--ac2);background:rgba(79,124,255,.08);}
.rep-dd.open .rep-tbtn svg{color:var(--ac2);}
.rep-dd.open .rep-chev{transform:rotate(180deg);}
/* .rep-menu / .rep-menu-item migrated to shared `.dropdown-menu` / `.dropdown-item`.
   Keep .rep-menu for the parent-open toggle + list-style row dividers. */
.rep-menu{display:none;padding:0;}
.rep-dd.open .rep-menu{display:block;}
.rep-menu-item{justify-content:space-between;padding:10px 13px;border-radius:0;border-bottom:0.5px solid var(--brd);}

.rep-menu-item.checked{color:var(--ac2);}

/* .rep-srch migrated to shared `.search-pill` (in shared/app.css) */

/* ── Mobile drawer ── */

/* Mobile search toggle (hidden on desktop) */

.mobile-search-toggle.has-query::after{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--bg);}

/* Mobile search overlay (top-anchored, replaces header) */

.mso-back:hover,.mso-back:active{color:var(--tx);background:var(--sur2);}
.mso-input-wrap{flex:1;display:flex;align-items:center;gap:8px;min-width:0;}
.mso-input-wrap input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-family:var(--font);font-size:16px;font-weight:400;padding:0;min-width:0;}

.mso-clear{width:32px;height:32px;flex-shrink:0;background:transparent;border:none;cursor:pointer;color:var(--mu);display:none;align-items:center;justify-content:center;border-radius:50%;transition:color .12s,background .12s;}

.mso-clear:hover,.mso-clear:active{color:var(--tx);background:var(--sur2);}
/* In-menu search (used in Location dropdown — desktop popup + mobile sheet) */

.rep-menu-srch svg{width:13px;height:13px;color:var(--mu);flex:none;}
.rep-menu-srch input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-family:var(--font);font-size:13px;padding:0;}

<script src="../../shared/leads-comms.js"></script>
<script>
var _navToastTimer = null;
function showNavToast(title, body){
  var t = document.getElementById('nav-toast'); if(!t) return;
  if(title) document.getElementById('nav-toast-title').textContent = title;
  if(body)  document.getElementById('nav-toast-body').textContent = body;
  t.classList.add('show');
  if(_navToastTimer) clearTimeout(_navToastTimer);
  _navToastTimer = setTimeout(hideNavToast, 4000);
}
function hideNavToast(){
  var t = document.getElementById('nav-toast'); if(t) t.classList.remove('show');
  if(_navToastTimer){ clearTimeout(_navToastTimer); _navToastTimer = null; }
}

function repNav(label){
  document.querySelectorAll('.rep-item').forEach(function(el){ el.classList.toggle('active', el.getAttribute('data-rep') === label); });
  if(window.innerWidth <= 900) closeRepDrawer();
  if(label === 'Reviews') return;
  if(label === 'Dashboards'){ window.location.href = '../reputation_dashboard/Dashboard.html'; return; }
  if(label === 'Settings'){ window.location.href = '../settings/settings.html'; return; }
  showNavToast(label + ' is coming soon', 'This section is under construction.');
}
function toggleRepDrawer(){
  var sb = document.getElementById('rep-sb'), bd = document.getElementById('rep-backdrop');
  var open = sb.classList.toggle('open'); bd.classList.toggle('show', open);
}
function closeRepDrawer(){
  document.getElementById('rep-sb').classList.remove('open');
  document.getElementById('rep-backdrop').classList.remove('show');
}

function _repSyncSheet(){
  var l = document.getElementById('rep-loc'), c = document.getElementById('rep-cat');
  var anyOpen = (l && l.classList.contains('open')) || (c && c.classList.contains('open'));
  document.body.classList.toggle('rep-sheet-open', !!anyOpen);
}
/* Period segmented toggle */
var _repPeriod = 'Monthly';
function repPeriodScale(){
  switch(_repPeriod){
    case 'Daily':  return 1/30;
    case 'Weekly': return 7/30;
    case 'All':    return 24;
    default:       return 1;
  }
}

function _revPageNums(page, total){

  else if(page >= total - 2){ lo = total - 3; hi = total - 1; }
  else { lo = page - 1; hi = page + 1; }
  var out = [1];
  if(lo > 2) out.push('...');

    trend.pos.push(t.pos); trend.neu.push(t.neu); trend.neg.push(t.neg); trend.rating.push(t.avg);
  });
  // Source — split sentiments per source from CCLeads.REVIEWS
  var srcKeys = ['google','usadirect'];
  var srcLabels = {google:'Google', usadirect:'USA Direct Auto'};
  var bySrc = {}; srcKeys.forEach(function(k){ bySrc[k] = {pos:0, neu:0, neg:0}; });
  CCLeads.REVIEWS.forEach(function(r){
    if(!bySrc[r.source]) return;
    var b = (r.rating >= 4) ? 'pos' : (r.rating === 3 ? 'neu' : 'neg');
    bySrc[r.source][b]++;
  });
  var source = {buckets:srcKeys.map(function(k){return srcLabels[k];}), pos:[], neu:[], neg:[]};
  srcKeys.forEach(function(k){ source.pos.push(bySrc[k].pos); source.neu.push(bySrc[k].neu); source.neg.push(bySrc[k].neg); });
  // Status by year
  var status = {buckets:years, responded:[], unresponded:[], notResp:[]};
  years.forEach(function(y){ status.responded.push(0); status.unresponded.push(0); status.notResp.push(0); });
  CCLeads.REVIEWS.forEach(function(r){
    var year = String(new Date(r.ts).getFullYear());
    var i = years.indexOf(year); if(i < 0) return;
    if(r.responses && r.responses.length) status.responded[i]++;
    else if(r.status === 'Not Respondable') status.notResp[i]++;
    else status.unresponded[i]++;
  });
  return {trend:trend, source:source, status:status};
}

function _revNiceMax(v){
  if(v <= 5) return 5;
  if(v <= 50) return Math.ceil(v/10)*10;
  if(v <= 500) return Math.ceil(v/100)*100;
  return Math.ceil(v/200)*200;
}
function revChartStacked(o){
  // o: {buckets, stacks:[{cls,vals}], totals?, leftTitle, rightAxis?:{vals,max,title}}
  var W = 860, H = 320, mL = 56, mR = (o.rightAxis ? 56 : 16), mT = 26, mB = 46;
  var plotW = W - mL - mR, plotH = H - mT - mB;
  var n = o.buckets.length;
  var slot = plotW / n;
  var barW = Math.min(180, slot * 0.55);
  var maxY = _revNiceMax(o.totals ? Math.max.apply(null, o.totals) : 0);
  if(o.maxY) maxY = o.maxY;
  var ticks = 4; // 0, maxY/4 ..
  var s = '<svg class="rev-r1-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  // gridlines + left Y labels
  for(var t=0; t<=ticks; t++){
    var y = mT + plotH - (t/ticks)*plotH;
    var v = Math.round((t/ticks)*maxY);
    s += '<line class="rc-grid" x1="'+mL+'" y1="'+y+'" x2="'+(W-mR)+'" y2="'+y+'"/>';
    s += '<text class="rc-axis" x="'+(mL-8)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>';
  }
  // Left Y title
  s += '<text class="rc-ytitle" transform="translate(14 '+(mT+plotH/2)+') rotate(-90)" text-anchor="middle">'+ (o.leftTitle||'Review Volume') +'</text>';
  // Right Y axis (line chart only)
  if(o.rightAxis){
    for(var t2=0; t2<=5; t2++){
      var y2 = mT + plotH - (t2/5)*plotH;
      s += '<text class="rc-axis" x="'+(W-mR+8)+'" y="'+(y2+3)+'" text-anchor="start">'+t2+'</text>';
    }
    s += '<text class="rc-ytitle-right" transform="translate('+(W-12)+' '+(mT+plotH/2)+') rotate(-90)" text-anchor="middle">'+o.rightAxis.title+'</text>';
  }
  // Bars + totals + x labels
  var y0 = mT + plotH;
  for(var i=0; i<n; i++){
    var bx = mL + i*slot + (slot - barW)/2;
    var stackSum = 0;
    o.stacks.forEach(function(stk){ stackSum += stk.vals[i] || 0; });
    var yTop = y0;
    o.stacks.forEach(function(stk){
      var v = stk.vals[i] || 0; if(v <= 0) return;
      var h = (v/maxY) * plotH;
      yTop -= h;
      s += '<rect class="'+stk.cls+'" x="'+bx+'" y="'+yTop+'" width="'+barW+'" height="'+h+'"/>';
    });
    if(stackSum > 0){
      s += '<text class="rc-total" x="'+(bx+barW/2)+'" y="'+(yTop-6)+'">'+stackSum+'</text>';
    }
    s += '<text class="rc-axis" x="'+(bx+barW/2)+'" y="'+(y0+18)+'" text-anchor="middle">'+o.buckets[i]+'</text>';
  }
  // Right-axis line + dots
  if(o.rightAxis){
    var pts = o.rightAxis.vals.map(function(v,i){
      var cx = mL + i*slot + slot/2;
      var cy = mT + plotH - (v/5)*plotH;
      return {cx:cx, cy:cy};
    });
    var path = pts.map(function(p){return p.cx+','+p.cy;}).join(' ');
    s += '<polyline class="rc-line" points="'+path+'"/>';
    pts.forEach(function(p){ s += '<circle class="rc-dot" cx="'+p.cx+'" cy="'+p.cy+'" r="4"/>'; });
  }
  s += '</svg>';
  return s;
}
function revR1Trend(){
  var d = REV_R1.trend;
  var totals = d.buckets.map(function(_,i){ return d.pos[i]+d.neu[i]+d.neg[i]; });
  var svg = revChartStacked({
    buckets:d.buckets,
    stacks:[
      {cls:'rc-stk-neg', vals:d.neg},

      {cls:'rc-stk-pos', vals:d.pos}

    + '<span class="rev-r1-leg"><i style="background:var(--gr)"></i>Positive</span>'

    + '<span class="rev-r1-leg"><i style="background:var(--rd)"></i>Negative</span>'
    + '<span class="rev-r1-leg line"><i></i>Average Rating</span>'
    + '</div>';
  return '<div class="rev-r1-chart-scroll">'+svg+'</div>' + leg;
}
function revR1Source(){

function revR1Status(){

  var totals = d.buckets.map(function(_,i){ return d.responded[i]+d.unresponded[i]+d.notResp[i]; });

  return '<div class="rev-r1-chart-scroll">'+svg+'</div>' + leg;
}
function revR1Set(tab){
  document.querySelectorAll('.rev-r1-tab').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
  var sel = document.getElementById('rev-r1-select'); if(sel && sel.value !== tab) sel.value = tab;

}

<!-- Product switcher behavior -->
<script>
(function(){
  function portalSwitcher(){ var ps=document.getElementById('product-switcher'); if(ps && ps.parentElement !== document.body) document.body.appendChild(ps); }
  function positionSwitcher(){ var logo=document.querySelector('.logo'), ps=document.getElementById('product-switcher'); if(!logo||!ps) return; var r=logo.getBoundingClientRect(); ps.style.left=((window.innerWidth>640)?66:r.left)+'px'; ps.style.top=(r.bottom+8)+'px'; }
  function toggleProductSwitcher(e){ if(e) e.stopPropagation(); var logo=document.querySelector('.logo'), ps=document.getElementById('product-switcher'); if(!logo||!ps) return; portalSwitcher(); var w=!ps.classList.contains('ps-open'); if(w) positionSwitcher(); ps.classList.toggle('ps-open', w); logo.classList.toggle('ps-open', w); }
  function closeProductSwitcher(){ var logo=document.querySelector('.logo'), ps=document.getElementById('product-switcher'); if(logo) logo.classList.remove('ps-open'); if(ps) ps.classList.remove('ps-open'); }
  window.toggleProductSwitcher = toggleProductSwitcher;
  window.closeProductSwitcher = closeProductSwitcher;
  function init(){ portalSwitcher(); document.querySelectorAll('.ps-item').forEach(function(a){ a.classList.toggle('ps-active', a.getAttribute('data-pid') === 'reputation'); }); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  document.addEventListener('mousedown', function(e){ var ps=document.getElementById('product-switcher'); if(!ps || !ps.classList.contains('ps-open')) return; if(e.target.closest && (e.target.closest('.logo') || e.target.closest('#product-switcher'))) return; closeProductSwitcher(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeProductSwitcher(); });
  window.addEventListener('resize', function(){ var ps=document.getElementById('product-switcher'); if(ps && ps.classList.contains('ps-open')) positionSwitcher(); });
  window.addEventListener('scroll', function(){ var ps=document.getElementById('product-switcher'); if(ps && ps.classList.contains('ps-open')) positionSwitcher(); }, true);
})();
</script>
